name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub's merge queue tests the batch here; `pytest` must report on it.
  merge_group:
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

# Only the newest run for a PR branch can be the answer, and every superseded
# run is holding runners that the shards below need. Cancel them on pull
# requests; never on main, where each commit's result stands on its own.
# Branch protection only ever reads the head commit's checks, so cancelling an
# older commit's run cannot unblock a merge.
#
# The group must ALSO be unique per commit off pull requests. With
# cancel-in-progress false a group still holds only ONE pending run, so a
# third push to main while one run is going and another is waiting silently
# cancels the waiting one (measured 2026-10-05: 82d0d89d and 54d3da42 on main
# were cancelled this way). A per-commit group on push gives each main commit
# its own slot.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite is split across several runners, and each runner additionally
  # spreads its slice over its own cores (`-n auto`, set in pyproject.toml).
  # `scripts/ci_shard.py` does the splitting; it slices by test FILE, so a
  # module is never divided and within-module ordering is unchanged.
  #
  # Why two, not five. Five shards existed because five individual tests were
  # together over half the suite's 758.7s and none of them overlapped, so
  # whichever shard held two of them paid their sum. All five have since been
  # fixed at the source (see scripts/ci_shard.py's module docstring): three
  # whole-repo AST scans in test_one_definition_per_quantity.py now share one
  # cached parse instead of three, test_ops_scripts_importable.py's fstring
  # scan shares that same cache, and test_tech_analyst.py's 60s test was a
  # real, unmocked token-rate-governor sleep caused by a prior test's charge
  # leaking across the process -- fixed by resetting the governor between
  # tests in tests/conftest.py, not by giving it more room to hide in.
  # With those gone, two shards kept the run near two minutes (19 Sep). By
  # 14 Oct the slower shard took 8m17s of its 10-minute limit on trunk and a
  # PR shard was cut off at 93% (run 38603485151), so there are now three.
  #
  # To change the shard count, edit this list and nothing else: the script is
  # told how many shards there are via `strategy.job-total`, so the two cannot
  # drift apart.
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One failing shard must not hide the others; we want the whole picture
      # in one run.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      # fetch-depth: 0 (full history) so scripts/definition_of_done.py can
      # resolve the true merge-base against origin/main and read every
      # commit message on the change, not just the tip and its immediate
      # parent. Item 132: a depth-1 checkout of a PR's merge commit left
      # earlier branch commits' trailers unreadable even after the gate's
      # own on-demand deepen-to-2 fix, because that only resolves HEAD^1,
      # not the full ancestry of a multi-commit branch.
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Refuse early when the runner is short of disk: at 100% everything fails
      # at once and looks like a code problem. Thresholds live in the script.
      - name: Disk guard
        run: python3 scripts/disk_guard.py --scratch /tmp

      # Undefined-name check (stdlib symtable); see scripts/check_undefined_names.py.
      - name: Undefined names
        run: python3 scripts/check_undefined_names.py

      # Version comes from .python-version (the single place it's written;
      # see tests/conftest.py for the matching local-side check) rather than
      # a literal here, so this and the other setup-python step below can't
      # drift apart from each other or from what a developer/agent runs.
      - name: Set up Python (pinned in .python-version)
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      # Measured 2026-09-19 (runs 35396584309/35395293092/35386277411): with
      # only the built-in pip wheel cache above, "Install package + test
      # deps" already takes ~13-20s per shard because the wheels are warm --
      # `Run pytest` is the actual cost at ~128-138s per shard. This second,
      # explicit cache goes one step further and skips `pip install` (and its
      # dependency resolution) entirely on a hit by caching the built
      # virtualenv itself. It is keyed on the OS, the exact resolved Python
      # version (so a runner image bump that changes the interpreter's
      # absolute path can't restore a venv pointing at a binary that no
      # longer exists) and a hash of pyproject.toml, so any dependency change
      # invalidates it.
      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package + test deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run pytest
        # Inject dummy values for required env vars so any import-time
        # reads in main.py / config loaders don't fail in CI. The test
        # suite itself mocks every external client (Anthropic, OpenAI,
        # Alpaca, FRED) — no real network calls happen.
        env:
          ANTHROPIC_API_KEY: dummy-anthropic-key-for-ci
          OPENAI_API_KEY: dummy-openai-key-for-ci
          ALPACA_API_KEY: dummy-alpaca-key-for-ci
          ALPACA_SECRET_KEY: dummy-alpaca-secret-for-ci
          FRED_API_KEY: dummy-fred-key-for-ci
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # Refuse to run a split that is not a clean partition of the suite.
          # A dropped file would be tests silently not running underneath a
          # green required check, which is worse than a slow build.
          python scripts/ci_shard.py --shards "${{ strategy.job-total }}" --check
          mapfile -t UNITS < <(
            python scripts/ci_shard.py \
              --shards "${{ strategy.job-total }}" \
              --index "${{ matrix.shard }}"
          )
          if [ "${#UNITS[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} was handed nothing to run"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ strategy.job-total }}: ${#UNITS[@]} units"
          # --durations surfaces the slow files in the job log. The suite's
          # cost is concentrated in a handful of wall-clock assertions rather
          # than spread across the 6,600 tests, so these are the numbers to
          # refresh `SLOW_FILES` in the splitter from, and they are free.
          pytest -q --durations=12 "${UNITS[@]}"

  # `pytest` is the required status check in branch protection on main, so this
  # job keeps that name and is the only thing branch protection looks at. It
  # runs on `always()` precisely so that it still reports when a shard failed,
  # was cancelled or never ran — and in every one of those cases it must go
  # red. A green `pytest` over a shard that did not run would remove the only
  # gate on this repository.
  #
  # `needs.shard.result` is the aggregate over the whole matrix: it is
  # 'success' only when every leg succeeded, and 'failure', 'cancelled' or
  # 'skipped' otherwise. Anything that is not 'success' fails this job.
  # The dashboard bundle (src/api/static_cockpit/) is build output, not
  # committed; the deploy builds it. This job proves the build and the
  # frontend tests pass, then runs the bundle checks in test_api_safety.py
  # against the fresh build. QAMC_REQUIRE_COCKPIT_BUILD=1 turns their "not
  # built" skip into a failure, so they can never skip silently here.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up node (pinned in frontend/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile-exact)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build into src/api/static_cockpit
        working-directory: frontend
        run: npm run build
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Set up Python (pinned in .python-version)
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install package + test deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Bundle checks against the fresh build
        env:
          QAMC_REQUIRE_COCKPIT_BUILD: "1"
        run: |
          .venv/bin/python -m pytest -q -n 0 \
            tests/test_api_safety.py::test_cockpit_static_mount_serves_the_built_index \
            tests/test_api_safety.py::test_cockpit_homepage_links_to_desk_diary \
            tests/test_api_safety.py::test_cockpit_index_html_only_references_built_assets

  pytest:
    name: pytest
    needs: [shard, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A change that edits the board file together with code collides with
      # every other change in flight; see scripts/check_board_edits_alone.py.
      # Skipped on main itself (no branch to compare) and in the merge queue
      # (a batch holds several changes, so the diff would blame one change
      # for another's edits; each was already checked on its own PR run).
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Board edits travel alone
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin main
          python3 scripts/check_board_edits_alone.py origin/main
      - name: Require every shard to have passed
        run: |
          set -euo pipefail
          result="${{ needs.shard.result }}"
          echo "aggregate result of all test shards: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::test shards did not all succeed (aggregate result: ${result})"
            exit 1
          fi
          echo "every test shard passed"
      # The deploy now builds the dashboard and aborts if that fails, so a
      # change that breaks the build must not merge.
      - name: Require the frontend build and tests to have passed
        run: |
          set -euo pipefail
          result="${{ needs.frontend.result }}"
          echo "frontend job result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::frontend build/tests did not succeed (result: ${result})"
            exit 1
          fi

  # ADVISORY, NOT REQUIRED — deliberately absent from branch protection's
  # required-status-check list (`contexts: ["pytest"]`, verified 2026-09-18).
  # `scripts/check_board_number_claims.py` asks GitHub what OTHER open pull
  # requests currently claim, to catch the exact race that produced three
  # board-item-number collisions in an hour on 2026-09-29/30 (188 twice, then
  # 189 twice) before it reaches `main` rather than after. That read is a
  # live network call to the GitHub API and can rate-limit, time out, or be
  # stale the instant it returns — turning it into a REQUIRED check would
  # convert an ordinary GitHub hiccup into a blocked merge queue, which is
  # its own outage. So this job runs for visibility only: a real collision
  # is printed loudly and the job goes red in the run log, but a failed
  # GitHub read is not a collision and exits 0 — see the script's own
  # module docstring. The two locally-verifiable halves (no duplicate
  # number on the board, no live number that is also retired) ARE required:
  # they run inside the `shard`/`pytest` jobs above as ordinary tests
  # (`tests/test_board_item_numbers.py`), because they need no network call
  # and can never be flaky.
  board-number-advisory:
    name: board-number-advisory (not required to merge)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python (pinned in .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the one dependency the import chain needs
        # src.inflight -> src.notifier imports `requests` at package load; this
        # job never ran `pip install`, so it died on ModuleNotFoundError.
        run: python -m pip install requests

      - name: Check this PR's board item numbers against other open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/check_board_number_claims.py --pr-number "${{ github.event.pull_request.number }}"
