  - id: phase_9
    title: "Phase 9 — The research desk actually deliberates"
    plain_summary:
      verdict: "Every research seat can now propose its own trade ideas, not just the chart analyst — the core architectural change the owner asked for."
      points:
        - "News, earnings, and macro research can each nominate a stock the chart analyst hadn't already flagged, within a bounded limit per seat and per run."
        - "The chart analyst is then brought in specifically to check whether there's a real tradeable setup for each nomination."
        - "If sources disagree on a symbol and that disagreement is never resolved, that specific trade idea is dropped rather than risking a bad call — the rest of the session's trades are unaffected."
        - "How much can be risked on an idea now scales automatically with how many independent sources agree on it — that scaling is deterministic, not a judgment call."
        - "The desk now keeps a scorecard: which researcher raised each idea, which ones backed it, which ones argued against it, and — once the position closes — who was right. A researcher who correctly warned against a trade that lost money is credited for it."
        - "How strongly a researcher stated a view does not change what its call is worth (owner decision, 2026-08-31). Scaling the score by a researcher's own confidence would assume the answer to the question the scorecard exists to ask, and a confident view already gets a bigger position, so it already earns or loses more. Instead, each researcher's record is shown split by how confidently it spoke, so a reader can see for themselves whether its confident calls are worth more."
        - "Bets on a share falling now count exactly like bets on a share rising (owner decision, 2026-08-31). If the bet made money it is a win and a positive amount; if it lost money it is a loss and a negative amount; the researcher that argued for a profitable one is credited and the one that argued against it is charged. Nothing is reversed or worded differently because the bet was on a fall. Previously these trades were not scored at all, because they were never grouped into positions the way ordinary buys are."
        - "That scorecard is a record only. It does not influence what gets traded or how much is risked, and a test enforces that by running the decision step with the scorecard on and off and requiring identical orders."
      outstanding: "Still missing from the owner's full specification: separate scores for raising an idea versus judging someone else's, how often a researcher's ideas actually become trades, scoring an objection that blocked a trade against what that trade would have done, a rolling window so old calls fade, and tracking how a researcher's view of a symbol changes between sessions."
    status: "PARTIAL"
    confidence: "high"
    evidence:
