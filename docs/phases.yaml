#     a real host) — those checks are recorded as `kind: manual` and named
#     explicitly. Phases marked DONE, NOT DEPLOYED always carry both: the
#     mechanical rules that prove the work is real and merged, and the one
#     manual rule that says how to check whether it has shipped since.
