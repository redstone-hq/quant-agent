#   - commit_in_main / pr_merged / file_exists / symbol_in_file / test_exists
#     / setting_equals can all be checked from a plain clone of this repo.
#   - Whether a commit that is on `main` has actually reached the production
#     box is NOT something a rule kind in this schema can check (that needs
