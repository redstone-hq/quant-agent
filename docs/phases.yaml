      - kind: manual
        note: "Short round trips are scored as of 2026-08-31 (owner decision). _assign_position_ids (§6.2a) previously opened a chain only on a BUY, so no SHORT was ever chained and no short round trip existed to score; a SHORT now mints a chain and the COVER family retires it, mirroring BUY/SELL, with stops and trails retiring either side. The sign convention is the point: a short that made money is a win and a positive number, one that lost money is a loss and a negative number, and nothing is inverted or specially worded for direction. This changed no trading behaviour — position_id is a forensic column read by nothing in the decision chain, and a test requires byte-identical constructed orders either way."

  - id: rehearsal_rig
    title: "Rehearsal rig — a full session, offline, in under a minute"
    plain_summary:
      verdict: "A full trading session can now be replayed offline, end to end, in under a minute — with no real money, market connection, or AI cost involved."
      points:
        - "It replays a saved copy of a real trading day instead of touching the live broker, market data, or paid AI models."
        - "A full run costs nothing and takes well under a minute, so a change to the trading logic can be checked before it's ever allowed near real positions or real spending."
        - "This matters because the market is only open a small fraction of the week — waiting for it to test something isn't realistic."
        - "It can reproduce, on demand, the exact day the desk stopped trading entirely after tripping a spending limit on only seventeen cents of real cost — so that failure can be checked against going forward instead of argued about from memory."
        - "For four days it gave a pass or a fail on identical code depending on which saved answers it happened to pick up. Fixed on 2026-09-02: it now always replays one specific saved trading session, and prints which one, so two runs of the same code give the same answer."
        - "It also has a third answer now — 'could not judge' — for when it could not faithfully recreate the session. That used to look identical to a real failure, and a red light cost an hour of argument instead of being believed or dismissed. It is deliberately hard to reach, so a genuine fault is never quietly excused."
        - "Honest limit, stated where it will be read: it still cannot recreate a full morning offline — the news and economic-data feeds are unreachable — so it can show you that a morning got worse, but not that a morning is well."
    status: "DONE AND LIVE"
    confidence: "high"
    evidence:
      - kind: file_exists
        path: "ops/rehearsal/run.py"
        note: "the rig's entry point"
      - kind: file_exists
        path: "ops/rehearsal/replay.py"
        note: "serves recorded model responses so a rehearsal makes no paid calls"
      - kind: file_exists
        path: "ops/rehearsal/broker.py"
        note: "the offline broker — a rehearsal cannot reach Alpaca"
      - kind: test_exists
        path: "tests/test_rehearsal_reproduces_cost_ceiling.py"
        test: "test_the_settled_cost_ceiling_still_stops_the_portfolio_manager"
        note: "2026-09-13: renamed and rewritten (item 28, now retired). The old name asserted the absence of three trigger codes the cost-circuit rewrite had already deleted, so it guarded nothing, and it failed for an unrelated reason — it demanded a rehearsal against a snapshot taken today use exactly as many technical-analyst chunk calls as 2026-08-28 recorded, which today's larger universe cannot. It was red on main continuously and the 2026-09-04 'fix' was never run. The test now reproduces the same failure class against the mechanism that replaced the projections: it measures what a rehearsal really settles by the time it reaches the Portfolio Manager, then re-runs the identical session with the ceiling set to that measured figure and requires the settled-cost circuit to refuse the Portfolio Manager before it reaches a provider. Verified to go red when that circuit branch is disabled. See docs/INCIDENT_HISTORY.md, 2026-09-13 'the permanently-red cost-ceiling test'. This block is no longer CONTRADICTED."
      - kind: manual
        note: "Passing tests here prove the rig runs end to end and that it can still force-reproduce the 2026-08-28 cost-ceiling failure on demand — they do not prove the recorded model responses and market snapshot it replays against are still a faithful stand-in for a real trading day. That snapshot is fixed at the moment it was taken; as the strategy, the traded universe, and the market itself move on, a person needs to periodically judge whether it is still representative or needs refreshing, since no test can check that on its own. Re-check by looking at the snapshot's date and asking whether anything material has changed since."

