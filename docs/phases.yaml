  - id: invariants
    title: "Invariants (must hold at all times)"
    plain_summary:
      verdict: "All eight rules that must never be broken hold true right now — but nothing checks that automatically, day after day."
      points:
        - "Trading only ever happens on the practice-money account, never with real money."
        - "Every position always carries a hard stop — there is no such thing as an unprotected trade."
        - "No single trade can be sized to lose more than 5% of the account."
        - "Deterministic safety code, not the AI, always has the final word on whether a trade goes through."
        - "Only the owner can change any of these rules."
      outstanding: "None of the eight has an automated check that runs continuously to prove it's still true. This has been confirmed by reading the code once, not by a live watchdog."
