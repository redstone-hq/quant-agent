[project]
name = "quant-agent"
version = "0.1.0"
description = "LLM-agent quantitative trading system for US stocks"
authors = [
    {name = "Yebo Feng", email = "fengyebo@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "yfinance>=0.2.40",
    "alpaca-py>=0.30.0",
    "pandas>=2.2.0",
    "ta>=0.11.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.30.0",
    # yfinance's `Ticker.earnings_dates` (past + upcoming earnings-report
    # dates, used by the cockpit chart's earnings markers) needs lxml as an
    # HTML-parsing backend but does not declare it as a hard dependency —
    # without it the call silently returns nothing rather than raising, so
    # every PAST earnings marker was invisible in production until this was
    # added (2026-09-12 incident, see docs/INCIDENT_HISTORY.md).
    "lxml>=5.0.0",
    # `requests` is already pulled in transitively by alpaca-py / yfinance /
    # anthropic, but src/notifier.py (Telegram push) uses it directly, so
    # declare it explicitly to avoid silent breakage if those upstreams
    # ever drop the dep.
    "requests>=2.31.0",
    # Python's zoneinfo falls back to the system tzdata. Linux cloud images
    # (incl. Ubuntu server) often ship without /usr/share/zoneinfo/US/Eastern,
    # which breaks every `ZoneInfo("US/Eastern")` in trading_calendar / APScheduler.
    # The PyPI tzdata package ships an embedded copy that zoneinfo picks up
    # automatically — harmless on systems that already have system tzdata.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    # Runs the suite across every CPU (see [tool.pytest.ini_options] below).
    "pytest-xdist>=3.6",
    # Freezes the real clock for every module, however it imported utc_now (tests/conftest.py freeze_clock).
    "time-machine==2.16.0",
    # Size/shape limits (tests/test_ruff_clean.py). Pinned EXACTLY: a new ruff
    # release can change what a rule counts, which would move a fixed limit.
    "ruff==0.16.10",
    # Import-boundary contracts (.importlinter, tests/test_import_contracts.py). Exact pin: a release can change what counts as an import.
    "import-linter==2.15",
    "httpx>=0.27.0",
    # tests/test_api_*.py import fastapi directly, so the API deps are part of
    # what the test suite needs — not just what the API process needs. Without
    # these, all 8 API test modules fail at collection and pytest exits 2
    # before running any test at all. Kept mirrored with the `api` extra below.
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
# Stage 2 (Thin Read-Only Mission Control API) — a separate, optional
# process from trading. `pip install -e .` alone (trading-only) does not
# pull these in; only `pip install -e '.[api]'` does. Reuses the `pydantic`
# already pinned above for response models. See src/api/ and
# docs/architecture/MISSION_CONTROL_API.md.
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Run the suite in parallel across every available CPU. Measured 2026-09-14 on
# the 6-core box: 6,007 tests in 224s in parallel against ~463s one at a time,
# 0 failures, on two separate runs with different schedulers. Tests never
# touch the live desk or its database; each worker gets its own tmp_path.
# A test that genuinely needs to run alone should be fixed to isolate its
# state, not taken out of the parallel run. `-n 0` runs serially for
# debugging.
addopts = "-n auto"

# Temp directory retention: shared server disk filled to 81% with pytest's
# /tmp/.../pytest-of-*/ directories; nothing removes them between runs.
# tmp_path_retention_policy="failed" keeps only failed-run directories for
# debugging (passing runs have no diagnostic value and caused the 6 GB bloat).
# tmp_path_retention_count=5 limits failed-run retention: enough for
# post-hoc diagnosis without re-accumulation between housekeeping sweeps.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 5

# Size and shape limits, FIXED here and never re-derived from trunk (docs/GUARDS_WITHOUT_STORED_STATE.md).
# Enforced as an ordinary test (tests/test_ruff_clean.py) inside the required `pytest` check.
# The numbers are ruff/pylint's published defaults (mccabe 10, statements 50, branches 12);
# 120 is the width the old fence used. They are per FUNCTION, so squeezing lines cannot dodge them.
[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
# A frozen historical text whose sha256 is pinned (tests/test_absolute_floor_record.py): it must stay byte-identical.
exclude = ["tests/fixtures/resolver_log_bodies_pre_move.py"]

[tool.ruff.lint]
# PGH003: a `type: ignore` must name its error code; TID251: `typing.cast` is banned (it silences the
# checker instead of fixing the type; use src/money.py values). Both measured at zero violations 2026-10-09.
select = ["E501", "E701", "E702", "E703", "C901", "PLR0912", "PLR0915", "PGH003", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "cast() silences the type checker instead of fixing the type; use src.money types or a real conversion"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12

# Files that already broke a limit on 2026-10-08, keyed by PATH and by the exact rule each breaks.
# New files are held to the limits. This list may only shrink: delete an entry when its file is fixed;
# never add one.
