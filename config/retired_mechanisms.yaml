# Mechanisms this desk USED to have, and the words that described them.
#
# WHY THIS FILE EXISTS. On 2026-09-14 the daily-loss breaker stopped
# liquidating the book and started halting instead (docs/WORK.md item 32).
# `_midday_emergency_liquidate` and `_check_late_breach_and_emergency_
# liquidate` were deleted. Three days later four places were still describing
# the deleted behaviour, and two of them were text the desk PAID a model to
# read: the position reviewer's assembled prompt told the seat, every time
# any safety net had fired, that the desk performs an "emergency sell-all on
# −3% daily-loss breach". Both the mechanism and the number were gone.
#
# Deleting code does not delete the prose about it, and prose is not compiled.
# This file is the compiler. Retiring a mechanism means adding it here, and
# then the build fails until every description of it is gone too.
#
# ADD AN ENTRY WHENEVER YOU DELETE OR RENAME A MECHANISM A MODEL IS TOLD
# ABOUT. That is the only maintenance this check asks for, and it is asked
# at exactly the moment the person has the facts: the deletion commit.
#
# Fields:
#   retired      YYYY-MM-DD, from git, not from memory.
#   why          one plain line: what replaced it.
#   symbols      code identifiers that no longer exist. Also checked against
#                the source itself, so a resurrected name fails too.
#   phrases      prose forms of the same claim, lowercased, matched as
#                substrings. THIS is the field that catches prompt text,
#                because prompts never name the function.
#   allowed_in   whole files where a mention is legitimate: this registry,
#                the incident history, the check's own tests. A TOMBSTONE in
#                live code does NOT get a whole file — it puts the marker
#                `retired-ok` on the line. Per line, because allowing a whole
#                file is how `src/pipeline.py` would have gone on hiding the
#                `run_intra_check` docstring, one of the four sites this
#                check exists to find.
#
# Scope note, stated rather than implied: `phrases` is a substring match over
# prompt files, agent-assembled strings, docstrings and comments. Keep each
# phrase specific enough that it cannot appear innocently. A phrase like
# "sell" would be useless; "emergency sell-all" cannot be about anything else.

retired:

  - name: daily-loss whole-book liquidation
    retired: 2026-09-14
    why: >-
      Replaced by `_halt_on_daily_loss_breach`, which refuses new risk,
      verifies every held position's stop AT THE BROKER, files a durable
      per-symbol reason and alerts the owner. It closes, resizes and zeroes
      nothing. The old path submitted LIMIT orders 1% through the market and
      then restored the original stops on any leg that did not fill, so on a
      correlated gap it cancelled every protective stop, sold nothing, and
      put the stops back. It never once fired in production.
    symbols:
      - _midday_emergency_liquidate
      - _check_late_breach_and_emergency_liquidate
    phrases:
      - "emergency sell-all"
      - "emergency-sell every position"
      - "emergency sell every position"
      - "sell-all when daily loss"
      - "liquidates every position"
      - "force-liquidates"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: the flat -3% daily-loss threshold
    retired: 2026-09-11
    why: >-
      SUPERSEDED 2026-09-20 — there is no daily-loss threshold of any kind
      any more: the whole account-level breaker was removed on the owner's
      instruction (see the 2026-09-20 entry below). This entry stays because
      the phrases below must never come back. At the time it was written the
      breaker had one limit with three rungs and none of them was a flat
      -3%; today the honest answer to "what is the daily-loss threshold" is
      that the desk does not have one.
    symbols: []
    phrases:
      - "-3% daily-loss"
      - "−3% daily-loss"
      - "-3% daily loss"
      - "−3% daily loss"
      - "daily loss breached -3%"
      - "3% daily-loss breach"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: correlation breach as an exit trigger
    retired: 2026-09-13
    why: >-
      Removed from `_HARD_TRIGGER_KEYWORDS` and
      `EXTERNAL_INFORMATION_PATTERNS` (docs/WORK.md item 44). Nothing in the
      desk computes a correlation-breach EVENT, so the claim was never
      checkable, and a correlation is a function of the price series, so it
      was never external information either. The position reviewer's prompt
      still names it — to tell the seat it does NOT match — which is why that
      file is allowed below.
    symbols: []
    phrases:
      - "correlation breach is a valid trigger"
      - "correlation cluster breach is a valid trigger"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: the account-level loss-alarm halt and the rolling-return BUY brake
    retired: 2026-09-20
    why: >-
      Removed ENTIRELY on the owner's direct instruction, not as a defect
      fix. His words: "I'm starting to think that I'm fine with the stops on
      the individual stocks and I do not want a nuclear option so remove the
      whole secondary halt on portfolio completely because there's too many
      things you keep finding where a slight normal fluctuation in the market
      can liquidate or halt everything — that's too dangerous to leave — the
      proper stop losses should be enough." Gone: the daily circuit breaker
      that halted new trading on the day's loss, the 5-day / 20-day
      rolling-return brakes that halved every new BUY and SHORT, the
      volatility yardstick built to set their thresholds, and every gate,
      status, banner and alert that existed to serve them. What REMAINS is
      the §11.2 peak-to-trough gross-exposure de-levering ladder
      (`GROSS_LADDER`), which is a different mechanism the owner did not ask
      to remove: it trims exposure gradually and never halts the desk.
      Per-position stops are the desk's loss protection.
    symbols:
      - check_daily_loss
      - daily_loss_numerator
      - daily_loss_limit_pct
      - daily_loss_limit_basis
      - apply_drawdown_scale
      - DRAWDOWN_BUY_SCALE
      - vol_relative_drawdown_threshold_pct
      - measure_portfolio_daily_vol
      - _halt_on_daily_loss_breach
      - _daily_loss_breach
      - _alert_owner_daily_loss_halt
      - _check_late_breach_and_halt
      - drawdown_5d_threshold_pct
      - drawdown_20d_threshold_pct
      - drawdown_buy_cap
      - drawdown_buy_halved
      - effective_max_daily_loss_pct
      - daily_loss_halted
      - daily_loss_recheck
      - in_drawdown
      - held_book_daily_vol_pct
      - held_book_daily_pnl
      - normalized_holding_weights
      - portfolio_daily_vol_pct
      - unprotected_at_halt
      - REALIZED_VOL_WINDOW_SESSIONS
      - MIN_REALIZED_VOL_RETURNS
      - REALIZED_VOL_SKIP_NEWEST_SESSIONS
      - DEFAULT_DRAWDOWN_VOL_SENSITIVITY
    # The five deleted settings.yaml KEYS — `max_daily_loss_pct`,
    # `daily_loss_risk_multiple`, `drawdown_vol_sensitivity`,
    # `drawdown_5d_risk_multiple`, `drawdown_20d_risk_multiple` — are
    # deliberately NOT listed above. `RiskConfig._reject_deleted_loss_alarm_
    # keys` has to name them to refuse them, and it refuses them at config
    # load with a loud error, which is a stronger guarantee than this
    # scanner gives. Listing them here would only flag that validator.
    phrases:
      - "daily-loss circuit breaker"
      - "daily loss circuit breaker"
      - "daily-loss breaker"
      - "halves every new buy"
      - "halved every buy"
      - "in_drawdown=true — the risk engine"
      - "no new risk this session"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: the automatic 25% oversized base-allocation cut
    retired: 2026-09-26
    why: >-
      IT NEVER EXISTED IN CODE. Two live sheets described it as machinery:
      `config/prompts/portfolio_manager.md` told PM "Cut every BUY base 25%"
      on 2+ `oversized` tags, and `config/prompts/risk_manager.md` told the
      Risk Manager that PM "pre-adjusts its sizing before you ever see the
      plan — 2+ `oversized` tags cut its base allocations 25%", and used that
      as grounds to discount a conservative-looking plan as anchoring rather
      than conviction. What is real: `_build_rm_recent_verdicts`
      (`src/pipeline.py`) renders the last 5 verdicts with their `cat=` tags
      into PM's sheet, and PM's sheet asks the model to adjust. Nothing reads
      `reason_category` and resizes anything; the 25% was an invented figure
      (`docs/WORK.md` item 99(f), measured 2026-09-19 — 36 of 37 recorded
      `risk_allocation_pct` sat on the prompt's own 0.25 grid with a maximum
      of 3.0, no trace of a 25% haircut). The number is removed rather than
      replaced: choosing a different one would be the same defect. A seat may
      be shown another seat's history; it may not be told that history has
      already been acted on when it has not.
    symbols: []
    phrases:
      - "cut every buy base 25%"
      - "base allocations 25%"
      - "pre-adjusts its sizing before you ever see the plan"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: the noise floor as a target-level filter ("not a destination")
    retired: 2026-09-30
    why: >-
      `derive_structural_target` used `min_target_atr_multiple` to FILTER its
      candidate levels, so a structural level inside one ATR of entry left
      the candidate set entirely and the target was taken from the next level
      out — on the far side of the wall price had just been rejected from.
      The closer the wall, the further past it the desk aimed. META's
      2026-09-21 add is the measured case: floor $749.63 swallowed computed
      resistance at $730.41 and $739.84 and the stored target became $785.20,
      above both rejections and above the then 52-week high. The filter was
      load-bearing when a 1.5 reward:risk floor was a hard refusal (2026-09-01
      — dropping a sub-noise level was the only way a trade with a close wall
      could be admitted); that gate is now inert and nothing re-checked the
      filter when its reason died. The constant survives and still means what
      it said, but it now LABELS the derived target
      (`TargetDerivation.target_inside_noise`) instead of selecting it. The
      retired thing is the SELECTION, and the prose that described it: four
      sites still told a reader the target is the nearest level "more than N
      ATRs away" / that a nearer one "is not a destination", which now
      describes machinery the desk does not have.
    symbols: []
    phrases:
      - "is not a destination"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

  - name: sweep-vehicle liquidation before a BUY
    retired: 2026-09-30
    why: >-
      `CashSweeper.fund_buys` and `park_excess` were deleted (docs/WORK.md
      item 190). The desk no longer sells the cash-equivalent sweep vehicle
      to fund a BUY, and no longer parks excess cash into it. Three seats —
      portfolio manager, position reviewer, risk manager — were told the
      parked balance is auto-liquidated before any BUY executes and is
      therefore already inside the cash figure they size against. Both
      halves of that are now false: the parked value is a POSITION
      (`parked_value`), it is not part of the cash shown, and nothing sells
      it before a BUY. All three sheets now say the parked balance is not
      sold to fund a BUY and is not part of the cash figure.
      `release_retired_vehicle` (the one-way exit of a leftover vehicle) was
      deleted later, 2026-10-14, once no code path could buy the vehicle.
    symbols:
      - fund_buys
      - park_excess
    phrases:
      - "auto-liquidated before any buy"
      - "auto-liquidated before"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/board_notes/
      - tests/test_retired_mechanisms.py

# ===========================================================================
# described: LIVE mechanisms that prompt text tells a paid seat about.
# ===========================================================================
#
# The section above runs after somebody records a retirement. This one makes
# them record it. Each entry pins a live code symbol to the exact places its
# behaviour is described. Delete or rename the symbol and the build fails at
# the deletion site, listing every sentence that just became untrue and
# pointing at the one way out: move it to `retired:` above with the phrases
# that described it. See `src/retired_mechanisms.py` for why this is not a
# third grep, and `src/prompt_bindings.py` (item 107) for the other case —
# behaviour that CHANGED while still existing.
#
# Fields:
#   name          what the mechanism is, in words.
#   why           what the seats are told, so a reader at the deletion site
#                 can judge the damage without opening three files.
#   symbols       file + dotted symbol (`name` or `Class.method`). Must
#                 resolve to a def/class right now.
#   described_in  file + `contains:` needles, each >= 12 characters and each
#                 fitting inside ONE source line. Any file: the two
#                 confirmed drift cases on this desk were Python-assembled
#                 strings, not prompt files, so `src/agents/*.py` is the
#                 primary surface here, not an afterthought.
#
# ADD AN ENTRY when you write prose describing a mechanism a seat is paid to
# read. DO NOT add an entry per sentence — that is the annotate-everything
# design already rejected. Add one when the sentence would be a LIE if the
# code went away.

described:

  - name: the contradicted-exit veto
    why: >-
      The position reviewer is told that a SELL or REDUCE citing stalling,
      lack of progress, fading momentum or deterioration on a name whose
      own recorded numbers improved will be VETOED by deterministic code.
      That is a promise about `veto_contradicted_exit` and the deterioration
      vocabulary in `is_deterioration_claim`. Delete either and the seat is
      being threatened with a gate that no longer exists, which changes how
      it writes every exit reason.
    symbols:
      - file: src/risk/exit_guard_deltas.py
        symbol: veto_contradicted_exit
      - file: src/risk/exit_guard_deltas.py
        symbol: is_deterioration_claim
      - file: src/risk/exit_guard_deltas.py
        symbol: MetricDeltas.net_improved
    described_in:
      - file: src/agents/position_reviewer.py
        contains:
          - "A SELL or REDUCE on one of these citing stalling, "
          - "be VETOED by deterministic code"

  - name: same-day trim discipline
    why: >-
      The reviewer is told which positions already took a sell-side action
      today - "a midday REDUCE, or a deterministic de-lever" - and that it
      must hold them absent a fresh hard trigger. Which symbols those are is
      decided by `TradingPipeline._symbols_already_trimmed_today`, and the
      executor enforces the rule independently of the prompt. If the query
      goes, the section silently renders the wrong set or nothing at all,
      and the 2026-05-04 AMZN 41 -> 21 -> 11 double-trim is back.
    symbols:
      - file: src/pipeline_exits.py
        symbol: ExitEngineMixin._symbols_already_trimmed_today
    described_in:
      - file: src/agents/position_reviewer.py
        contains:
          - "(a midday REDUCE, or a deterministic de-lever)"
          - "Already Trimmed Today"

  - name: risk-manager edits apply as an increment, and may only reduce
    why: >-
      The risk manager is told that an `allocation_pct` it edits is applied
      as an INCREMENT on top of what is already held, and that an edit
      RAISING it is refused by the engine while a reduction is applied.
      Both halves are `RiskGate._apply_risk_modifications`. If that
      guard went, the seat would go on believing it cannot increase risk
      while its edits did exactly that.
    symbols:
      - file: src/pipeline_risk_gate.py
        symbol: RiskGate._apply_risk_modifications
    described_in:
      - file: src/agents/risk_manager.py
        contains:
          - "that raises it is refused by the engine; only a "
          - "that raises it is refused by the engine, only a "

  - name: the technical seat's market-context and structural-levels blocks
    why: >-
      The technical seat's Input section tells it, in so many words, that it
      receives a computed market-context block and Python-computed structural
      levels. `format_context_block` and `format_levels_block` are the code
      that makes those two sentences true. Delete or rename either and the
      prompt is describing data the seat is no longer sent, which this desk
      treats as a lie rather than a wording problem (item 99(b)).
    symbols:
      - file: src/data/context.py
        symbol: format_context_block
      - file: src/data/levels.py
        symbol: format_levels_block
    described_in:
      - file: config/prompts/tech_analyst.md
        contains:
          - "**Market context** — computed returns"
          - "**Structural levels** — support/resistance computed in Python"
