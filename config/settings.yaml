api_keys:
  anthropic: "${ANTHROPIC_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  deepseek: "${DEEPSEEK_API_KEY}"   # optional; required only if any *_model is a deepseek-* id
  openrouter: "${OPENROUTER_API_KEY}"   # optional; required only if any agent has provider: openrouter
  # Google AI Studio direct (2026-08-31 owner decision) — required: the eight
  # specialist/review seats below run provider: google as their PRIMARY.
  google: "${GOOGLE_API_KEY}"
  fred: "${FRED_API_KEY}"
  alpaca_key: "${ALPACA_API_KEY}"
  alpaca_secret: "${ALPACA_SECRET_KEY}"

alpaca:
  base_url: "https://paper-api.alpaca.markets"  # paper trading
  paper: true

llm:
  # === Accepted model routing policy ===
  # See docs/architecture/MODEL_ROUTING_POLICY.md for the evidence.
  # Reproduce with: python ops/model_policy/benchmark_models.py --from-onecli
  #
  # The specialist/review seats were selected from 148 graded trials (2026-08-12)
  # run through these very agent classes and prompts. Three models scored a
  # perfect mean AND a perfect worst run across the measured sweep;
  # gemini-2.5-flash-lite won those shared seats on latency and cost, being
  # 83x cheaper than the `openai/gpt-5.5` baseline and 5-10x faster per call
  # than the other perfect scorer. The Risk Manager was re-measured
  # separately on the current branch and diverges below at equal measured
  # seat quality to preserve PM/RM model independence.
  #
  # The per-seat structure is now exercised: PM resolves to GPT-5.5, the Risk
  # Manager resolves to Qwen, and the remaining seats resolve to Gemini. That
  # keeps future seat changes a config
  # edit rather than a plumbing change, and it is what
  # `ops/commissioning/verify_commissioning.py` pins against.
  #
  # `provider` MUST stay explicit on every seat. OpenRouter's
  # "vendor/model" ids collide with native prefixes, so resolve_provider()
  # cannot infer them — an unset provider routes to Anthropic and fails on
  # the first call of the session (src/agents/base.py).
  #
  # === 2026-08-31: primary moved to Gemini DIRECT, OpenRouter to BACKUP ===
  # Owner decision (docs/WORK.md "NEXT UP"). The eight seats below moved off
  # `provider: openrouter` / `google/gemini-2.5-flash-lite` onto
  # `provider: google` / `gemini-3.5-flash-lite` (Google AI Studio direct,
  # bare id — no "google/" vendor prefix, that form is OpenRouter-only).
  # Google refuses 2.5 outright to new keys ("no longer available to new
  # users"), so 3.5 is the only id a new key gets — both the primary above
  # and `llm.fallback_model` below move together, or the backup stops being
  # the same model. Free tier for project qamc-gemini; see
  # src/agents/base.py's _GOOGLE_TOKENS_PER_MIN for the measured RPM/TPM/RPD
  # ceilings this governs against.
  #
  # A new model id carries no fitted history: src/token_budget.py's
  # `_fit()` requires `MIN_SAMPLES = 8` (agents/model, agent_logs) before it
  # trusts a per-byte size model, and falls back to the conservative default
  # (1.0 tokens/byte, 6,000 fixed) below that — this is BY DESIGN (verified
  # against src/token_budget.py, not assumed), not a bug to work around.
  tech_analyst_provider: "google"
  tech_analyst_model: "gemini-3.5-flash-lite"
  news_analyst_provider: "google"
  news_analyst_model: "gemini-3.5-flash-lite"
  macro_analyst_provider: "google"
  macro_analyst_model: "gemini-3.5-flash-lite"
  earnings_analyst_provider: "google"
  earnings_analyst_model: "gemini-3.5-flash-lite"
  smart_money_analyst_provider: "google"
  smart_money_analyst_model: "gemini-3.5-flash-lite"
  portfolio_manager_provider: "openrouter"
  # 2026-08-25 production-grounding re-measurement: Gemini scored 0.00 after
  # omitting provenance/inventing holdings; Luna was unstable under the final
  # contract; GPT-5.5 scored 1.00/1.00 on both pm_constrained and the
  # 30-candidate/15-position production workload.
  portfolio_manager_model: "openai/gpt-5.5"
  # Endpoint preference, NOT a model change. OpenRouter serves this exact
  # model (`openai/gpt-5.5-20260423`) from three endpoints: `openai/flex` at
  # $2.50/$15 per M tokens and `openai` / `azure` at $5/$30. Same weights,
  # half the price, so there is no quality question to answer and no
  # benchmark to run. A measurement over the 10 days to 2026-08-27 put the PM
  # at 87% of all QAMC LLM spend ($5.84 of $6.73), but that window included
  # runaway looping incidents (the reason the LLM cost circuit breaker was
  # added) and is not a clean baseline — treat 87% as unreliable, not as the
  # PM's steady-state share. This change is correct regardless: it halves
  # whatever the PM's actual share turns out to be.
  #
  # Fallbacks stay ENABLED: if the flex tier is saturated the call falls
  # through to the full-price endpoint and the session continues. Losing a
  # trading session to save $0.11 would be a bad trade. Actual cost stays
  # truthful either way because OpenRouter reports what it charged per call
  # (`usage: {include: true}`) and that figure, not the pinned rate, is what
  # the daily cost circuit spends against.
  portfolio_manager_provider_order: ["openai/flex"]
  risk_manager_provider: "openrouter"
  # The ONE seat that diverges, and the reason the per-seat structure exists.
  #
  # PR #30 review: the claim that "every alternative scored worse at the RM
  # seat" was false — it read the whole-sweep aggregate as if it were the
  # seat's result. On 2026-08-12, 10 of 12 candidates scored 1.00/1.00 at
  # `risk_rr_breach`. Re-measured on the current branch (2026-08-14, 30
  # trials, 2 RM scenarios x 3 repeats), four candidates tie at 1.00 mean and
  # 1.00 worst run, so there is no quality trade to make here.
  #
  # With quality tied, the review's ordering makes PM/RM model independence
  # the next criterion: this seat is the gate over the Portfolio Manager, and
  # a shared model shares its blind spots. At measurement time that eliminated
  # gemini-flash-lite (then the PM's model) and left three. Latency and cost
  # then broke the tie —
  # qwen3-235b answers in 10.4s against 61.4s (glm-5.2) and 113.0s
  # (deepseek-v4-pro), at 1/14th their cost.
  #
  # Independence is effectively free: $0.00162 vs gemini's $0.00163 per two
  # RM calls, and +8s on a session with a 1200s kill in which RM issues
  # exactly ONE call. (That last point is what makes this seat different from
  # tech_analyst, where five sequential calls made latency disqualifying.)
  #
  # NOT a general promotion of this model: it scored 0.95 mean / 0.85 worst
  # across the full six-scenario sweep and is measured only at THIS seat.
  risk_manager_model: "qwen/qwen3-235b-a22b-2507"
  # HELD BACK from the 2026-08-31 Gemini-direct migration, deliberately.
  # position_reviewer is a DECISION SEAT: docs/architecture/MODEL_ROUTING_POLICY.md
  # requires a model measured AT THAT SEAT, enforced by
  # tests/test_model_routing_policy.py::test_decision_seats_run_a_model_measured_at_that_seat.
  # No benchmark exists for gemini-3.5-flash-lite at the midday_exit scenario,
  # and none CAN be produced for the incumbent 2.5 as a comparison because
  # Google refuses 2.5 to new keys. Migrating this seat would mean asserting
  # quality that has not been measured, so it stays on the route where it has
  # evidence until the benchmark is run and committed:
  #   ops/model_policy/benchmark_models.py --scenario midday_exit --models gemini-3.5-flash-lite
  # The other seven seats are NOT decision seats and moved as planned.
  position_reviewer_provider: "openrouter"
  position_reviewer_model: "google/gemini-2.5-flash-lite"
  evening_analyst_provider: "google"
  evening_analyst_model: "gemini-3.5-flash-lite"
  # Global fallback — any per-agent override below takes precedence.
  # Hard output ceiling used by the pre-call cost reservation.  16K covers
  # the observed production PM payload (~11K output tokens) while making the
  # maximum liability of every request finite and useful to the breaker.
  max_tokens: 16000
  # One explicit reasoning budget for EVERY seat on the OpenRouter path, so
  # every model is measured/traded under identical, declared settings
  # instead of its own undeclared default (some reasoning models were
  # exhausting max_completion_tokens on hidden thinking and returning
  # truncated answers). "medium" is OpenRouter's documented default for
  # `reasoning.enabled=true` with no effort given — see
  # https://openrouter.ai/docs/use-cases/reasoning-tokens.
  reasoning_effort: "medium"
  # Ask OpenRouter to constrain output to this agent's pydantic result
  # schema via response_format (json_schema) — see
  # https://openrouter.ai/docs/features/structured-outputs. One setting for
  # every seat; no per-model exceptions.
  structured_output: true
  tech_analyst_max_tokens: 16000
  news_analyst_max_tokens: 16000
  macro_analyst_max_tokens: 16000
  earnings_analyst_max_tokens: 16000
  # Measured from production quant_agent.log/.log.1 (2026-08-26 to
  # 2026-09-02, 7 real calls): 6 completed cleanly with out= 438-650 tokens;
  # 1 hit finish_reason=length at exactly the old ceiling of 1200 (that run's
  # input was an outlier at in=23722, ~4x the typical ~5-7K). The schema caps
  # output structurally (at most 8 findings, summary/why_now <=24 words
  # each), so the theoretical max is roughly 750-900 tokens — yet the
  # measured max observed (650, n=6) already sits close to that, and a real
  # call still truncated at 1200. Set to 3000: ~2.5x the ceiling that just
  # truncated in production, comfortably above both the observed max and the
  # schema's structural cap, without inflating to the 16K sized for the
  # free-text analyst seats (different task shape — this seat returns a
  # short bounded JSON list, not prose).
  smart_money_analyst_max_tokens: 16000
  portfolio_manager_max_tokens: 16000
  risk_manager_max_tokens: 16000
  position_reviewer_max_tokens: 16000
  evening_analyst_max_tokens: 16000
  # Meta-reflector runs once per quarter (--mode meta). Dense digest input
  # + structured QuarterlyMetaReflection output. No benchmark scenario
  # covers it (see MODEL_ROUTING_POLICY.md "Known limitations") — assigned
  # by analogy to the portfolio_manager seat, whose output shape it most
  # resembles and which measured 1.00/1.00.
  meta_reflector_provider: "google"
  meta_reflector_model: "gemini-3.5-flash-lite"
  meta_reflector_max_tokens: 16000
  # Stage 1 (QAMC): explicit per-agent provider override. Unset/null still
  # infers the provider from the model-id prefix exactly as before, but the
  # accepted policy above does NOT rely on inference for the OpenRouter
  # seats: `provider: openrouter` is pinned because OpenRouter's
  # "vendor/model" ids would otherwise be ambiguous. Google-direct bare ids
  # (e.g. "gemini-3.5-flash-lite") ARE inferable from prefix, but `provider:
  # google` is still pinned explicitly on every seat above for the same
  # "never rely on inference for a live seat" discipline. Example of the
  # general seam:
  #   tech_analyst_provider: "openrouter"
  #   tech_analyst_model: "anthropic/claude-3.5-sonnet"
  # Valid values: anthropic | openai | deepseek | openrouter | google.
  #
  # === Cross-provider failover target (2026-08-31 owner decision) ===
  # Process-wide, not per-agent (see src/agents/base.py's
  # _DEFAULT_FALLBACK_PROVIDER/_DEFAULT_FALLBACK_MODEL and LLMConfig.
  # fallback_provider/fallback_model in src/config/__init__.py). OpenRouter serving
  # the SAME model the primary above uses direct: a failover changes the
  # ROAD, not the REASONING — the owner's explicit objection to the
  # inherited claude-opus-4-7 Anthropic fallback (an upstream `yebof`
  # remnant nobody at QAMC chose). Consequence worth noting: portfolio_manager
  # (openrouter + openai/gpt-5.5) still gets a real fallback here too — same
  # road (openrouter), different model (gemini instead of gpt-5.5) — which
  # still rescues a model-specific rate-limit, the exact shape of the
  # 2026-08-31 incident.
  fallback_provider: "openrouter"
  fallback_model: "google/gemini-3.5-flash-lite"
  # === ROUTE 3 (2026-09-23) — the first rung that changes the MODEL ========
  # Routes 1 and 2 above are the same model on two roads: that is ROUTE
  # diversity, and it is exactly what failed on 2026-09-22, when Google
  # direct refused with "This model is currently experiencing high demand"
  # 17 times and the same-model OpenRouter failover went down with it. Route
  # 3 is reached only after BOTH have failed.
  #
  # It runs over OpenRouter, not Anthropic direct, because OpenRouter is one
  # of only two LLM hosts with a verified OneCLI credential grant (see
  # docs/architecture/CREDENTIAL_DELIVERY_EVIDENCE.md — api.anthropic.com and
  # api.openai.com have none, so a route on either would collect a 401 every
  # time). Routing it here also means it inherits the uniform reasoning
  # effort, the structured-output constraint and `usage: {include: true}`,
  # all of which src/agents/base.py builds for OpenRouter and Google only.
  #
  # Note the id spelling: OpenRouter uses a DOT (`claude-haiku-4.5`) where
  # Anthropic's native id uses a dash. Set tertiary_model to "" to switch
  # route 3 off; the attempt-budget floor drops back in step.
  tertiary_provider: "openrouter"
  tertiary_model: "anthropic/claude-haiku-4.5"
  # === ROUTE 3's SECOND ROAD (2026-09-30) ================================
  # The three rungs above are all OpenRouter for the three DECISION seats
  # (portfolio_manager, risk_manager, position_reviewer — every one of them
  # `provider: openrouter`). On 2026-09-29 19:46:45-19:47:46 that cost the
  # desk the whole intraday decision run: route 1 HTTP 402 Payment Required
  # (OpenRouter credits exhausted), route 2 skipped on the demoted same
  # account, route 3 HTTP 402 again, "Every route is down." At 19:46:08 the
  # SAME PROCESS had completed tech_analyst on Google AI Studio direct,
  # HTTP 200, $0.00. One account balance was a single point of failure for
  # every decision the desk could make, with a healthy free road unused.
  #
  # When a seat's routes 1 and 2 resolve to the SAME provider and route 3
  # would too, route 3 is swapped for this pair instead. It adds no rung
  # and does not touch the eight Google-primary specialist seats, whose
  # ladder already spans two roads and for whom the haiku tertiary above is
  # still the right answer (their route 1 IS Google, so a Google route 3
  # would retry a road that just failed twice). No new host and no new paid
  # dependency: this is the same endpoint and the same credential those
  # eight seats already run as their PRIMARY.
  #
  # Set tertiary_alt_model to "" to switch the substitution off entirely.
  # Full reasoning, the accepted quality residual and the selection rule:
  # `_DEFAULT_TERTIARY_ALT_PROVIDER` and `select_tertiary_route` in
  # src/agents/base.py.
  tertiary_alt_provider: "google"
  tertiary_alt_model: "gemini-3.5-flash-lite"

# How aggressively an entry may cross the spread. Bounds EXECUTION cost, not
# position risk. A too-tight cap does not make the book safer — it silently
# stops it trading: on 2026-08-27 VLO's ask sat 28bp above the reference
# seconds after the open, a hardcoded 25bp cap produced a limit BELOW the
# offer, and the order could never fill. A SHORT uses the same number as a
# floor below the reference (fillability parity with BUY, not a second budget).
execution:
  max_entry_slippage_bps: 40
  # Single-shot reprice (rebuilt 2026-09-12): when a working entry limit
  # sits below the slippage ceiling and the market has moved away, the
  # order is let work for `repeg_poll_seconds`, then repriced ONCE, straight
  # to the ceiling (`max_entry_slippage_bps` above the reference captured at
  # submission — the price the entry was already approved to pay). Never
  # above it, and never a second time: Alpaca's own community practice for a
  # fast market is one decisive market-crossing replace, not a ladder of
  # nudges, and every extra replace is another `pending_replace` window to
  # get stuck in. The reprice is only sent once the exchange has
  # acknowledged the order (status `new`; a replace on an `accepted` /
  # `pending_new` order is rejected by Alpaca, and at the open that can
  # take seconds) — if it never gets there within the window, no reprice.
  # An entry still unfilled at the end of its session is CANCELLED, not
  # left resting until 16:00 ET (a resting order holds buying power all
  # day, and the next session re-analyses from scratch anyway), and the
  # owner gets a STANDALONE Telegram alert naming the symbol, the prices
  # tried and that it was cancelled. Nothing is auto-resubmitted (see the
  # comment above `_alert_owner_entry_cancelled` in src/pipeline_stages.py
  # for why that half is a deferred owner decision, not an omission).
  # OFF by default: an Alpaca replacement mints a NEW order id, and getting
  # that wrong is how you end up with an untracked working order or a
  # double position. The owner flips this deliberately.
  # (`repeg_max_attempts` was removed; the config loader rejects it.)
  repeg_enabled: false
  repeg_poll_seconds: 5
  # Automatic opportunity-cost rotation (Phase 14b, src/rotation.py). With
  # this OFF the desk still computes the comparison every morning and shows
  # it to the Portfolio Manager as information — the Phase 14 behaviour,
  # unchanged. With it ON, the desk will itself CLOSE one held position per
  # morning session when ALL of the following are true, measured from its
  # own data and never from a model's opinion:
  #   * the book's existing risk leaves less headroom than the minimum
  #     tradeable size (capital is genuinely constrained);
  #   * the held position fails the desk's OWN entry rules today (it would
  #     not be bought now — R2/R4/R5 in candidate_eligibility), so the
  #     comparison is categorical, not a rank wobble;
  #   * its structural protection has ALREADY broken under the item-25
  #     holding-discipline check (thesis level or stop level broken on two
  #     consecutive closes, or no level and outside the noise band) — a
  #     position whose thesis is still intact is never rotated out;
  #   * it was not bought today and has no order or protection-restore
  #     in flight;
  #   * the Portfolio Manager itself asked to BUY the best-ranked new
  #     candidate this session — the desk never invents the buy leg.
  # The close is proposed as an ordinary zero-size PM target and goes
  # through the SAME path as any PM-decided exit: constructor, hard risk
  # rules, AI Risk Manager review (which can refuse it), the holding-
  # discipline claim check, and the protected-sell discipline (stops are
  # cancelled write-ahead and restored if the sale never reaches the
  # broker). Nothing is bypassed and no new exemption exists.
  # A rotation that executes ALWAYS sends a standalone Telegram alert
  # naming what was sold, what it was sold to make room for, and the
  # measured reason; a second alert fires if the buy leg then did not
  # happen. Everything is written to the pipeline_event audit stream.
  # Was OFF by default: this is the desk selling a position without a human
  # or a model deciding to, so it required a deliberate enablement.
  # ENABLED 2026-09-12 by the owner, on the build described above and after
  # he set the condition that auto-selling must not happen until the book is
  # full: *"Auto selling isn't gonna happen until the portfolio is full. And
  # then pruning needs to have really good logic in place."* Both halves of
  # that condition are structural here, not conventions — the first gate is
  # the capital-constrained test (a half-empty book has headroom on every
  # limit, so nothing fires; 2026-09-23 that test became the UNION of the
  # risk budget and the deployable-entry budget, because the risk budget
  # alone had never once said "full" while the book sat at 1.99x of a 2.0x
  # gross ceiling), and the third is the holding-discipline break (a
  # position whose thesis is still intact is never rotated out). He also asked for it on
  # rather than shipped dark: *"I'd like it turned on at the start because
  # I'm gonna forget otherwise."*
  # NOTE: this has never executed against a live broker. The desk has been
  # paused since ~2026-09-03, so the first real rotation will be the first
  # end-to-end proof. Watch the first one.
  rotation_enabled: true
  # Board item 39, attempt 3. The RANKED-MARGIN rotation tier (both sides
  # still eligible; the new name cleared the provisional 25% like-for-like
  # margin) stays OFF. It is a second switch on top of `rotation_enabled`,
  # and it is not enough on its own: a ranked-margin sale additionally
  # requires a clearance object that only the projected-post-sale gate in
  # src/pipeline_stages.py can mint.
  #
  # It stays false because item 39(a) is unanswered, not out of caution:
  # ROTATION_MARGIN_PCT, the 25% score gap that decides when this tier
  # fires at all, is recorded in config/number_ledger.yaml as `arbitrary` -
  # "a round quarter percent with no source". Turning this on would make an
  # unmeasured number the sole reason for selling a position whose thesis
  # is intact, which this desk refuses everywhere else. docs/WORK.md item
  # 39(a) holds what has already been ruled out (do not repeat it) and
  # what would settle it. It is a research question, not an owner call.
  rotation_ranked_margin_enabled: false
  # Spec §11.1 (owner-ratified 2026-09-01). Exact position sizing: the share
  # count the risk math produced is used as-is instead of being floored to a
  # whole number. Whole-share rounding is a silent, constant tax — V wanted
  # 6% of the book and got 3.84%.
  #
  # ON by default. A symbol is still sized fractionally ONLY when Alpaca
  # confirms `fractionable` for it; an unknown or failed lookup falls back to
  # whole shares (fail closed, never fractional-by-assumption). Shorts are
  # always whole-share — a borrowed share cannot be fractional.
  #
  # Set to false to turn exact sizing off without a code change.
  #
  # BROKER CAPABILITY, measured 2026-09-01 against the live paper account:
  #     * a fractional GTC order is REFUSED — "fractional orders must be DAY
  #       orders" (code 42210000). This fires before the quantity-
  #       availability check, so it is a capability limit, not account state.
  #     * a fractional TRAILING stop is REFUSED at every tif.
  #     * ACCEPTED fractional: STOP/DAY, STOP_LIMIT/DAY, LIMIT/DAY.
  #     * whole-share GTC stops are unaffected (control probe accepted).
  #
  # HYBRID STOP COVERAGE is how a fractional position is protected given
  # that. A position of N.f shares carries TWO protective orders at the SAME
  # stop price:
  #     * a GTC stop over floor(N.f) — durable, survives 16:00 ET;
  #     * a DAY stop over the sub-share remainder — lapses at the close BY
  #       DESIGN and is re-placed by the first coverage sweep of the next
  #       session (`_reconcile_stop_coverage`, hoisted to the very first
  #       broker action of the morning run so the window at the open is as
  #       short as this system can make it).
  # Under one share there is no whole part, so it is a DAY stop only.
  #
  # THE ACCEPTED TRADE. The remainder is unprotected overnight. Owner ratified
  # 2026-09-02: without fractional sizing a ~$9,800 account is simply excluded
  # from the expensive names its own analysts keep picking, and being locked
  # out is itself a cost — one that applies to live capital too, not just paper.
  #
  # "BOUNDED UNDER ONE SHARE" IS WRONG AND WAS CORRECTED BEFORE HE DECIDED.
  # That holds only when a stock costs LESS than one position slot. When it
  # costs more, the ENTIRE position is sub-one-share, so 100% of it lapses
  # overnight rather than a sliver. Measured against the real universe:
  #   worst single position  ~$1,536
  #   worst whole book       ~$8,820 — the entire invested book at the ceiling
  #   typical, >= 1 share    ~$90
  # Six names already exceed one slot at 10 positions: SNDK, LLY, EQIX, GS,
  # COST, MU — exactly the names fractional exists to reach. A gap fills at the
  # open rather than at the stop, so realised exposure runs below that ceiling,
  # but the ceiling is the honest number and it is what he accepted.
  #
  # The lever if this is revisited: size fractionally only at >= 1 share. That
  # removes the 100% case and costs those six names. Owner declined that trade
  # — do not reintroduce it silently.
  #
  # Exposure is REPORTED IN DOLLARS on the session alert rather than trusted.
  #
  # ALERTING. A lapsed overnight DAY stop is EXPECTED and does not alert —
  # alerting nightly on a healthy system would destroy the credibility of the
  # one alert that must never be ignored. A stop that cannot be placed or
  # re-placed DURING MARKET HOURS alerts exactly as guard 2 always has, and a
  # missing whole-share GTC leg alerts at any hour. See
  # `_classify_coverage_gap` and `_reconcile_stop_coverage` in src/pipeline.py.
  #
  # THE PRECONDITION ABOVE IS NOW CHECKED. "Re-placed by the next session"
  # assumes a next session. When the trading timers were paused (2026-09-03)
  # the sweep stopped with them and ORCL's 0.3089-share remainder sat with
  # no stop through six full sessions, unreported. `src/coverage_watchdog.py`
  # (run from the daily 06:15 ET alert heartbeat, which fires whether or not
  # the trading timers are on) alerts the owner when broker coverage is short
  # of held AND no session ran during the last trading session — once per
  # trading day while it holds. Read-only; it never places an order.
  fractional_enabled: true
  fractional_share_decimals: 4
  # Live `trade_updates` websocket fill feed. ON since 2026-09-18.
  #
  # The socket pushes a message the instant an order fills, instead of the
  # desk discovering the fill on its next REST poll (up to half an hour
  # later). The REST path is unchanged and is still the fallback for every
  # wait the socket cannot serve.
  #
  # HISTORY, because this flag was off for a reason and the reason is gone.
  # From the socket being built (2026-09-10) to 2026-09-17 it NEVER
  # authenticated: 1,017 `failed to authenticate` lines across the retained
  # production logs and not one success. The cause was NOT the connection's
  # timing — six pull requests re-sequenced that and none of them could have
  # worked. The process held a 29-character placeholder credential literally
  # containing the word `placeholder`, and:
  #   * Alpaca authenticates this stream with an in-band websocket MESSAGE,
  #     not a handshake header, while the local gateway that substitutes the
  #     real key rewrites HTTP HEADERS — it cannot reach an in-band frame;
  #   * the installed `alpaca-py` stream is built on `websockets.legacy`,
  #     which has no proxy support at all, so the socket never traversed the
  #     gateway either.
  # So the desk was sending the word "placeholder" as its password.
  #
  # Real credential files were delivered 2026-09-18 and the process now
  # reads them directly (systemd credential, 26 characters) — so the single
  # blocker is gone and this flag is the only thing that was still holding
  # the socket shut. Nothing about credential handling changes here.
  #
  # Safe to have on: this is a PAPER account and the stream is RECEIVE-ONLY
  # — it delivers fill notifications and places no orders. A paper/live
  # endpoint mismatch is impossible by construction: src/config/__init__.py hard-
  # fails unless `paper` is true and the REST base_url is the paper host,
  # and the SDK derives the stream host from that same `paper` bool with no
  # url_override anywhere.
  #
  # No timeout, poll interval, retry count or ceiling changed with this
  # flip. If it is refused again, grep the log for
  # `trade_updates authentication REJECTED by broker` — that line now
  # carries Alpaca's own message and the key's LENGTH and first two
  # characters (never the value, never the secret). Success prints
  # `trade_updates websocket authenticated`, preceded by
  # `trade_updates authenticated with the CURRENT auth format` once per
  # process — see the auth-format block in src/execution/broker.py for why
  # the desk sends that frame itself and what the fallback costs.
  fill_stream_enabled: true

risk:
  # Single-name NOTIONAL ceiling — a concentration/liquidity backstop, not
  # the operative risk constraint. `max_position_risk_pct` (5%, owner-
  # ratified 2026-08-27) is supposed to be the real per-trade limit; this
  # cap was supposed to only ever bind on a genuinely too-tight stop.
  #
  # 20 -> 100 on 2026-09-04, real-data audit. It never worked as a backstop:
  # `notional_pct = risk_pct / stop_distance_pct`, and at this book's real
  # stop distances a 20% ceiling caps DELIVERED risk to `20% x stop_pct`
  # regardless of stated conviction. Measured live: 6 of 13 proposed orders
  # pinned at exactly 20% notional; a 2.8% and a 1.0% risk request both
  # delivered ~1% either way.
  #
  # RE-DERIVED 2026-09-11 against the CURRENT stop floor (this file's
  # min_stop_atr_multiple moved 3.0 -> 1.5 -> 2.5 since this cap was first
  # set; the 5-9%/~3.5% figures once written here are both stale — do not
  # trust either without recomputing, which is exactly what this update
  # does). At 2.5x ATR base (0.90-1.20x setup/regime scalers) and this
  # desk's ~2.56% median ATR, typical stops now run ~5.5-7.7% of price.
  # At the current 4% conviction-band ceiling (item 32, 2026-09-11), that
  # needs `4 / 5.5 x 100 ≈ 73%` notional — comfortably inside 100 with real
  # headroom, not a close call. Only a stop tighter than ~4-5.5% of price
  # (reachable via the level-backed exemption down to
  # `absolute_min_stop_atr_multiple: 1.0`, ~2.56% at the median ATR) still
  # hits this clamp — the same, already-intentional "genuinely too tight"
  # case this cap exists for, not a new edge case.
  #
  # 100 -> 33 on 2026-09-11. THE JUSTIFICATION FOR 100 WAS FALSE WHEN IT WAS
  # WRITTEN. It read: "100 was chosen over a larger number because
  # `allow_margin` is false: the cash-only rule already makes anything past
  # 100% of equity in one name unreachable in practice." Checked against git:
  # `allow_margin` was flipped to true on 2026-09-02 (commit a82f761, "margin
  # ON at 2.0x"), and that comment was written on 2026-09-04 (commit 012289a,
  # PR #258) — TWO DAYS AFTER the fact it asserted had stopped being true.
  # A cash-only rule was doing the work, and there was no cash-only rule.
  # So 100 was not a documented-but-unreachable ceiling; it was a live one.
  # With margin on and `max_gross_exposure_x: 2.0`, a single name at 100% of
  # equity is genuinely reachable.
  #
  # WHAT THIS CAP IS FOR, RESTATED. Every other risk number on this desk is
  # STOP-CONDITIONAL: `max_position_risk_pct` (5), the §9.4 agreement bands
  # ([3,4,5,5,5]) and `max_portfolio_risk_pct` (25) all price risk as
  # `shares x distance to stop`, which is the loss only if the stop actually
  # FILLS. This cap is the only parameter in the file that bounds the loss
  # when it does NOT — an overnight gap, a halt, a fraud disclosure, a
  # regulatory action. That failure mode is idiosyncratic and unforeseeable
  # by construction: no quantity of analyst agreement reduces it, because
  # every seat this desk runs is reading the same public record and shares
  # the same blind spot. This is a SURVIVAL ceiling, not diversification.
  # It is emphatically NOT portfolio construction — see docs/OUTCOME.md and
  # the owner's framing: "this is a trading desk, not a hedge fund, not a
  # mutual fund, not an ETF." Do not re-derive this from variance reduction,
  # risk parity or volatility targeting; all three have been rejected here.
  #
  # THE NUMBER. Labelled honestly, because it is two different kinds of
  # answer stacked:
  #
  # (a) REAL, CITABLE PRACTICE — direction only, not the number. Searched
  #     for a stated single-name NOTIONAL concentration limit used by real
  #     prop desks / CTAs. It does not exist as an industry standard: the
  #     published prop-firm "1-5% position cap" figures are RISK-PER-TRADE
  #     (this desk's own `max_position_risk_pct`, already set at 5), not a
  #     notional cap, and CTA sources state such limits are manager-specific.
  #     Do not let a later pass cite those as a notional standard; they are
  #     not one. The one genuinely citable regulatory number is SEC Rule
  #     15c3-1(c)(2)(vi)(M), the broker-dealer net-capital "undue
  #     concentration" provision: a single non-exempt equity position above
  #     10% of net capital (pre-haircut) attracts a 50% larger deduction.
  #     FINRA Rule 4210(g)(1)(I) likewise REQUIRES concentration monitoring
  #     but states no percentage. So regulators do treat single-name
  #     concentration as a first-order capital risk, and they start counting
  #     in the low tens of percent — but 10% of equity here would deliver
  #     ~0.6% risk per trade at this desk's stop distances and is a dealer
  #     inventory rule, not a directional desk's rule. It anchors the
  #     direction and the order of magnitude. It is not the number.
  #
  # (b) ACCOUNT-DERIVED — this IS the number, from this desk's own already-
  #     ratified parameters plus real, dated market events.
  #     CONSTRAINT: one idiosyncratic gap in one name must not, ON ITS OWN,
  #     put the desk past the deepest rung of its own ratified de-levering
  #     ladder — `GROSS_LADDER`'s -20% peak-to-trough rung
  #     (src/risk/rules.py), where the ceiling drops to 0.5x AND the owner is
  #     alerted. That is this desk's existing, owner-signed definition of
  #     "this is now an emergency". A single name must not be able to declare
  #     one by itself.
  #     TAIL MAGNITUDE, from real dated single-session declines on
  #     idiosyncratic disclosures — the cases where a stop does not protect
  #     you because the move is a gap or a halt:
  #       Luckin Coffee   2020-04-02  ~-75% (fabricated sales disclosed)
  #       Wirecard        2020-06-18  ~-62% (EUR 1.9bn unverifiable)
  #       Silicon Valley Bank 2023-03-09 ~-60% (then halted and closed)
  #       Kraft Heinz     2019-02-22  ~-28% (SEC subpoena, writedown)
  #       ADM             2024-01-21  ~-24% (accounting investigation)
  #     Median -60%. Small and deliberately severity-weighted: this is a TAIL
  #     parameter, not a central estimate, and -60% is the magnitude twice
  #     independently observed above rather than the -75% worst case.
  #     ARITHMETIC: 20 / 0.60 = 33.3 -> 33. This is the LADDER-CONSISTENT
  #     number — the largest single bet where even the median real disaster
  #     above stays under the desk's own -20% emergency rung.
  #
  # (c) OWNER OVERRIDE, 2026-09-11 — 33 -> 65, recorded honestly rather than
  #     re-derived to fit. The owner reviewed (a) and (b) directly, rejected
  #     33 as too tight for a desk that does not trade penny/micro-cap names,
  #     and set 65 as his own risk-appetite call. Stated explicitly at the
  #     time: avoiding penny stocks does not remove this failure mode —
  #     Luckin, Wirecard, SVB and Kraft Heinz above were all liquid,
  #     well-covered, non-penny names — and the owner accepted that trade-off
  #     with that correction on the table, not before it.
  #     WHAT 65 ACTUALLY COSTS, AT THE SAME FIVE EVENTS: the mildest (-24%)
  #     stays under the -20% rung (~15.6% of equity); the median (-60%) does
  #     NOT (~39%, nearly double the emergency line); the worst case (-75%)
  #     costs ~49%. So this is no longer "one gap cannot declare an emergency
  #     by itself" — a median-severity disaster now can. The ladder still
  #     fires and still de-levers what remains; it does not prevent the
  #     initial loss the way 33 was built to.
  #     THE OFFSETTING BENEFIT, also stated plainly: at the stop distances
  #     derived above (~5.5-7.7%), 65 does not bind on ordinary trades at all
  #     — a 4% tier-2 request's full notional range (~52-73%) mostly clears
  #     under 65, and only the tightest-stop extreme still clips. 33 was
  #     reintroduced KNOWINGLY as a live constraint; 65 is, by contrast,
  #     mostly a backstop against the single-name gap/fraud/halt scenario
  #     rather than a number that shapes everyday sizing. Conviction-based
  #     sizing is unaffected either way — a high-conviction idea still sizes
  #     larger than a low one, up to whichever ceiling is in force.
  # Never below `min_position_risk_pct` (0.5): even at the tightest stop the
  # level-backed exemption allows (1.0x ATR, ~2.56%), 65% notional still
  # delivers well above the floor, so this cap shrinks trades and never
  # refuses them outright.
  # Re-derive (b) again if `allow_margin`, `max_gross_exposure_x`,
  # `min_stop_atr_multiple` or the -20% `GROSS_LADDER` rung moves — (c) is
  # the owner's number regardless, but the comparison above should stay current.
  max_position_pct: 65
  # Caps NET exposure (longs minus shorts) as % of equity.
  #
  # 90 -> 200 on 2026-09-02. This number PREDATES the gross-exposure ladder
  # and was silently overriding it. For a long-only book net IS gross, so a
  # 90% net cap held the real ceiling at 0.90x — which means the ratified
  # 2.0x standing rung and the -8% 1.5x rung could NEVER bind. Only the
  # 1.0x and 0.5x drawdown rungs were reachable. The margin flip and the
  # ladder were both live and both decorative.
  #
  # Two settings were defining one quantity and the stale one won. The fix
  # is NOT to pick a better number here — it is to stop this setting being
  # a second definition. At 200 it equals `max_gross_exposure_x: 2.0`, and
  # since net can never exceed gross it is now non-binding by construction:
  # the LADDER governs, alone, and tightening the ladder tightens everything.
  #
  # This still hard-blocks (it is in HARD_BLOCK_RULES) — it has become a
  # backstop against a ladder that fails open, not a ceiling in its own
  # right. Raise `max_gross_exposure_x` above 2.0 and this must move with it.
  max_total_position_pct: 200
  # The account-level loss alarms that lived here — `max_daily_loss_pct` /
  # `daily_loss_risk_multiple` (the daily halt), `drawdown_vol_sensitivity`
  # (their volatility yardstick) and `drawdown_5d_risk_multiple` /
  # `drawdown_20d_risk_multiple` (the 5-day / 20-day brakes that halved
  # every new BUY and SHORT) — were REMOVED 2026-09-20 on the owner's
  # instruction. See docs/INCIDENT_HISTORY.md, retired item 32. The §11.2
  # peak-to-trough de-levering ladder below is a different mechanism and is
  # untouched. Do not reintroduce an account-level halt here.
  # Owner-ratified total at-risk ceiling: sum of (shares x distance from entry
  # to stop) across the book, as a % of equity. NOT a notional cap — full
  # deployment is intended; risk is what gets rationed. ENFORCED as of
  # Phase 2b (spec §2.2) — the constructor rations every risk-based target
  # against it before sizing, so the book is bounded by construction rather
  # than by a veto after the fact.
  max_portfolio_risk_pct: 25
  # Spec §2.1 — the owner-ratified per-trade envelope (2026-08-27). Conviction
  # is stated as the share of equity an idea may lose if its stop is hit, and
  # the constructor derives the share count from it and the stop distance:
  #     shares = (equity x risk_pct / 100) / |entry - stop|
  # A wider stop therefore yields a SMALLER position rather than a rejected
  # trade, which is what removes the incentive to squeeze stops. The previous
  # 0.5% ceiling lived in a constructor dataclass default nobody chose.
  max_position_risk_pct: 5
  # The owner's own minimum risk per trade (OUTCOME.md risk table,
  # 2026-08-27). With the 25% total-risk ceiling it also caps the book at
  # about 50 names. Alpaca charges no commission, so cost is NOT the reason.
  # A request rationed below the floor is denied outright rather than shrunk.
  min_position_risk_pct: 0.5
  # Spec §2.2 — the most of the total ceiling any ONE correlated cluster may
  # take. Without it, "total risk is under 25%" says nothing about
  # diversification: a book holding OKLO/CEG/VST/CCJ at 5% risk each sits at
  # 20% total while carrying one 20% bet on the nuclear theme. Correlated
  # names consume one bet's budget. Clusters are measured return correlation
  # (src/data/correlation.py), not a hand-maintained sector table.
  max_cluster_risk_share_pct: 40
  # Minimum stop distance in ATRs. Structure still places the stop; this only
  # pushes it out when structure put it inside ordinary volatility.
  #
  # ORIGINAL PROBLEM (2026-08-27, still true): stops sat a median 4.3% below
  # entry against a median ATR of 2.56% of price — about 1.7 ATRs, barely more
  # than one ordinary day's range. That fired exits inside noise, and forced
  # huge positions to reach any meaningful risk. A floor is the right fix.
  #
  # CORRECTED 2026-09-30 (board item 90): the heading below read "3.0 -> 1.5
  # on 2026-09-04" and there was no such move. This file went 3.0
  # (3dff9408, 2026-08-27) straight to 2.5 (0088328c, 2026-09-10) and never
  # deployed 1.5 — `git log --all -S'min_stop_atr_multiple: 1.5' --
  # config/settings.yaml` returns nothing. 0088328c is a SQUASH of PR #269:
  # sub-commit one moved 3.0 -> 1.5, sub-commit two moved 1.5 -> 2.5, both
  # merged together, so the 1.5 existed only inside that branch. The
  # reasoning recorded under the two headings below is sound and is kept;
  # only the dates and the implication that 1.5 was ever live are wrong.
  #
  # 3.0 -> 1.5 (PR #269, sub-commit one). THE 3.0 WAS NEVER DERIVED. Traced back, the
  # comment that introduced it jumps from a MEASURED 1.25 ATR ("one ordinary
  # day's range") to a CHOSEN 3.0 with nothing cited in between. Measured
  # against this desk's own record (docs/WORK.md item 33): 0 of 42 real
  # candidates cleared the floor on the one day with usable structural-level
  # data, and for RANGE setups — this desk's majority setup — 0 of 222 real
  # signals clear at any horizon this desk has ever stated. Not tight;
  # categorically closed. The arithmetic says why: a 3.0 ATR stop needs a 4.5
  # ATR target to clear a 1.5 reward:risk floor (since removed as dead code,
  # board item 81 — it never refused or shrank a trade), and published
  # doctrine puts 2-3x ATR on a TRAILING stop that moves up as a
  # trade works — never on a fixed entry stop combined with a reward:risk
  # floor. That specific combination is self-defeating and does not appear in
  # the literature.
  #
  # 1.5 -> 2.5 (PR #269, sub-commit two, merged 2026-09-10 in the same
  # squash as the leg above). The 1.5 was Sweeney MAE analysis on this desk's
  # own ~2-week trade history — the SAME window whose seat outputs were later
  # found to include misreported confidence/data quality (the 2026-09-04/05
  # content-honesty fixes). Owner call: that history is too short and now of
  # suspect provenance to be the ONLY basis for a risk-of-ruin number.
  #
  # 2.5 instead comes from published doctrine independent of this desk's own
  # data: general swing-trading guidance puts a fixed entry stop at 2.5-3.0x
  # ATR for a multi-day hold (vs 1.0x scalping, 1.5-2.0x intraday). This ONLY
  # applies when no real level backs the stop — a level-backed stop is always
  # judged on its own honest distance (owner clarification, 2026-09-10: the
  # reward:risk floor was never rejected as a concept; judging it against a
  # stop THIS FLOOR invented instead of a real one was).
  #
  # Note: Chandelier Exit / Van Tharp (also ~2-3x ATR, also raised in this
  # debate) are TRAILING-stop mechanisms, not fixed-entry ones — cited here
  # only as corroboration that this magnitude of ATR multiple is standard in
  # the literature, not as direct support for this specific fixed-stop use.
  #
  # CAVEAT, stated plainly: 2.5 does not by itself resolve the reward:risk
  # arithmetic tension below — it moves the binding horizon requirement into
  # a range this desk's own stated holds can plausibly clear, it does not
  # guarantee it.
  #
  # THE LAST LINE OF THAT CAVEAT USED TO READ "re-measure once honest
  # post-fix trade history exists", AND IT IS DELETED (2026-09-30, board
  # item 90) rather than left standing. It instructed the next reader to do
  # the one thing docs/OUTCOME.md forbids: re-measuring a threshold against
  # this desk's own past trades is fitting, "an arbitrary number with a
  # backtest stapled to it" (the 2026-09-12 correction), and it is how the
  # abandoned 1.5 was produced in the first place. No quantity of future
  # trade history will make that route legal.
  #
  # WHAT IS ACTUALLY OPEN, 2026-09-30 (board item 90).
  #
  # THIS NUMBER IS NOT SOURCED, and the comment above should not be read as
  # saying it is. "General stop-placement guidance" is not a citation:
  # docs/OUTCOME.md requires a URL a later reader can open. Searched
  # 2026-09-30 and recorded so nobody repeats it — the pages asserting
  # 2.5-3.0x for a FIXED multi-day entry stop are vendor and content
  # marketing, not literature; one secondary claim attributed to Technical
  # Analysis of Stocks & Commodities points the other way (1.5-2.0x); the
  # Van Tharp / Chandelier 2-3x figures are TRAILING mechanisms, which the
  # note above already concedes; and the top search hit for this desk's own
  # phrasing is now this desk's own PR #269. Note too that the band quoted
  # above (2.5-3.0) is not the band quoted a few lines below it (2-3).
  # So BOTH ends are unsupported, not just the point between them.
  #
  # 2.5 therefore STAYS as the interim value and is deliberately not
  # re-picked — with no cited band, moving it would be one more unsourced
  # choice — and it stays `arbitrary` in the ledger.
  #
  # The route that removes this constant for most of the names it governs
  # is board item 199: when no 5-touch level backs the stop, read the floor
  # off the nearest computed level below entry at any touch count instead
  # of off an ATR multiple. An earlier draft of this pass refused
  # reformulation on arithmetic that was wrong; see
  # `config/number_ledger.yaml` under
  # `src.config.RiskConfig.min_stop_atr_multiple` for the retraction and
  # the measured bounce-probability asymmetry that makes 191 viable.
  # Do not re-derive any of it here.
  min_stop_atr_multiple: 2.5
  # --- Level-backed stops (spec §12.1, 2026-09-01) --------------------------
  # The floor above used to OVERWRITE the structural stop whenever the level
  # sat closer than the band. The stop then pointed at nothing real, and the
  # reward:risk floor was judged against that fabricated number — which is why
  # 38 qualified signals produced zero trades on 2026-09-01. A stop that sits
  # at a level src/data/levels.py::find_structural_levels actually COMPUTED is
  # now honoured whatever its ATR distance. The band still applies to every
  # stop nothing computed backs. Neither number above moved: this changes
  # WHICH stop the arithmetic is done on, nothing else.
  #
  # `level_match_atr_tolerance` WAS HERE. DELETED 2026-09-13, docs/WORK.md
  # item 46. Do not re-add it — `RiskConfig` now refuses to load a settings
  # file that still carries it, on purpose.
  #
  # It was 0.25, i.e. "the stop counts as sitting AT a computed level if it
  # is within 0.25 ATR of it", and it justified itself by saying a computed
  # level is a ZONE (`src/data/levels.py` clusters pivots within
  # `CLUSTER_TOLERANCE_PCT` = 1% of price into one level) and that the
  # tolerance therefore had to be "at least that wide".
  #
  # Those are two different units, so the justification was not a statement
  # about the setting at all — it was a statement about the instrument:
  #
  #     0.25 x ATR  >=  0.01 x price     <=>     ATR  >=  4.0% of price
  #
  # i.e. it only held on names whose ATR is 4% of price or more. At the
  # 2.56%-of-price median ATR quoted throughout this file (measured on the
  # book 2026-08-27, see docs/QAMC_REMEDIATION_SPEC.md), 0.25 ATR is 0.64%
  # of price — 1.56x NARROWER than the zone it claimed to cover. A stop
  # placed inside a level's real zone was not recognised as level-backed, so
  # it was widened to the ATR band instead, which moves the stop off real
  # structure and changes the reward:risk the trade is judged on (item 1).
  #
  # It is deleted rather than re-tuned. There is no ATR multiple that stays
  # consistent with a percentage-of-price zone, because the ratio between
  # them is a different number for every name on every day — any value here
  # would have been a number fitted to one volatility. The match tolerance
  # is now READ from the zone's own definition
  # (`src.data.levels.level_zone_halfwidth`, derived from the same
  # `CLUSTER_TOLERANCE_PCT` that built the zone) and is not configurable.
  # One number instead of two, and they cannot drift apart.
  #
  # The ATR question is still asked, in the place it belongs: whether a stop
  # is far enough out to survive the name's own noise is
  # `min_stop_atr_multiple` and `absolute_min_stop_atr_multiple` below.
  # Which level a stop is sitting ON is an identity question about a zone,
  # and is answered in the zone's unit.
  # The deterministic backstop under that exemption. A level-backed stop is
  # honoured however tight DOWN TO this many ATRs; inside it, the stop is
  # pushed out to exactly this floor and never to the full band above. The
  # ratified §12.1 text leans on the 1*ATR floor written into
  # config/prompts/tech_analyst.md, but a prompt is an instruction to a model,
  # not a guarantee, and Invariant 2 requires the deterministic layer to be the
  # final authority. A genuine support level 0.2 ATR under entry is real
  # structure and still a guaranteed whipsaw.
  absolute_min_stop_atr_multiple: 1.0
  # How many prior touches a computed level needs before a stop resting on it
  # is trusted enough for the tight-stop exemption above (Phase 12.1,
  # 2026-09-03 — docs/RESEARCH_FINDINGS.md §7). The measured real-vs-shuffled
  # bounce-probability table only separates cleanly (non-overlapping 95% CIs)
  # at 5+ touches: real 0.644 [0.590, 0.696] vs shuffled 0.505 [0.470, 0.539].
  # Every lower bucket overlaps or nearly touches the shuffled range, i.e.
  # could be noise. Below this bar the stop is not treated as level-backed
  # and falls back to the ATR floors above, same as an unbacked stop.
  min_level_touches_for_stop_honor: 5
  # --- Target derivation (2026-09-01) ---------------------------------------
  # The floor above used to divide a stop computed from measured volatility by
  # a target the language model guessed. The morning run of 2026-09-01 rejected
  # 30 of 38 actionable signals (79%) on that arithmetic, including the two
  # highest-conviction calls of the day, and placed no trades. The floor stays
  # at 1.5 — it was never the defect. The target is now computed from the same
  # bars the stop comes from. The rule, and why each number is what it is:
  # src/data/levels.py, "Deriving the TARGET from structure".
  #
  # Flags a target inside this many ATRs of entry as thin reward — price is
  # barely off it and the whole payoff is one ordinary session's noise. It
  # LABELS the derived target; it does not choose it (changed 2026-09-30,
  # when it was found dropping close walls and targeting past them).
  min_target_atr_multiple: 1.0
  # Measured move claimed when nothing structural stands in the way, in
  # sqrt(session)-scaled ATRs. 1.0 = the typical excursion over the analyst's
  # stated horizon, and nothing more. This interacts with min_stop_atr_multiple
  # by arithmetic: a stop k ATRs out and a target p*ATR*sqrt(H) clear a floor f
  # only when sqrt(H) >= f*k/p. With p=1.0, f=1.5 and k=1.5 scaled by setup
  # (1.35 range, 1.50 breakout), a measured-move trade needs a stated horizon
  # of ~6 sessions on a breakout and ~5 on a range. A trade whose target is a
  # real level is looser — about 2 sessions — because the level need not be a
  # full projection away.
  #
  # These were ~15 / ~27 / ~12 until 2026-09-04, when the k above went 3.0 ->
  # 1.5. That is the whole reason the range branch was closed: this desk has
  # never stated a 27-session horizon, so no range trade could clear the floor
  # by arithmetic, whatever it was worth. Measured: 0 of 222 real signals.
  #
  # Raising this is the lever if the desk decides too much is being refused.
  # The old `min_reward_risk_after_widening` reward:risk floor is NOT — it
  # never refused anything since 2026-09-11 and was removed as dead code
  # (board item 81).
  #
  # 2026-09-11, funnel item 6: this projection now also covers the case where
  # the chart yielded levels but NONE of them sit in the trade's direction. It
  # used to require setup_type == "breakout" on top of that measured fact, so
  # real trades with genuinely nothing overhead were refused for a wording.
  # src/risk/constants.py::is_trend_trade owns that condition and is shared
  # with the reward:risk exemption above, so the two cannot drift apart.
  breakout_projection_atr_multiple: 1.0
  # How far price can plausibly get inside the horizon, same units. Looser than
  # the projection on purpose: a trade that works is an above-typical move, so
  # "could it reach that level at all" is a wider question than "how far do I
  # claim it goes when no level says otherwise".
  max_target_reach_atr_multiple: 1.5
  # DELETED 2026-09-26 (board item 56, route (c)): `max_stop_width_reach_atr_
  # multiple` was the threshold that REFUSED a trade for having too wide a
  # stop. It is gone, not retuned, and re-adding the key now raises at config
  # load. Measured first: across 648 sized stops in production it refused
  # zero trades, and the widest stop it ever saw was 1.29 x ATR x sqrt(H)
  # against its 1.5 cap. What answers a wide stop is the position size, which
  # is the response the literature actually prescribes. The touch-probability
  # READING is unchanged and still stamped on every sized stop.
  # Guard on the analyst's expected_horizon_sessions before it enters sqrt().
  max_target_horizon_sessions: 60
  # The model's target is kept as EVIDENCE, never as arithmetic. Above this
  # absolute gap from the computed target the disagreement is logged loudly —
  # a model consistently far from the chart is a finding about the seat.
  target_divergence_warn_pct: 25.0
  require_stop_loss: true
  # Cash-only is the pydantic CLASS default (`false`), not what this desk
  # runs — see `allow_margin: true` below. Set this back to `false` to
  # return to cash-only: BUYs are then capped at available cash, the risk
  # engine hard-blocks any BUY that would drive cash negative, and the PM +
  # midday prompts get a mandatory de-lever directive when cash is already
  # negative. With margin ENABLED (the current value), BUYs can spend
  # beyond available cash up to the §11.2 gross-exposure ladder's ceiling
  # (see `max_gross_exposure_x` below and `_entry_deployment_budget` in
  # `src/pipeline_stages.py`), and the PM/midday prompts disclose that
  # ladder headroom instead of the de-lever mandate.
  # ENABLED 2026-09-02, owner ratified: "change to two x. We're pushing it.
  # This is important. Remember, it's still paper trading. We're not even in
  # beta yet." Deliberately flipped only AFTER the gross-exposure ceiling and
  # the de-levering ladder were merged and verified, which was the ratified
  # sequencing. The PM prompt renders this ceiling from
  # {{risk.max_gross_exposure_x}} and applies it in every regime (per-regime
  # exposure bands deleted 2026-10-09 under the owner mandate: macro sets only
  # the long/short lean). Its de-levering-ladder table is in
  # `config/prompts/portfolio_manager.md`, not `src/agents/portfolio_manager.py`.
  allow_margin: true
  # --- Margin interest tracker (spec §11.2, 2026-09-01) ------------------
  # MEASURES only — never a risk check. Alpaca's live non-elite rate (elite
  # is 4.75%); kept here so it can be corrected without a code change.
  # Charged ONLY on the overnight debit balance, (balance x rate) / 360 —
  # intraday leverage is free. See src/margin_interest.py for the
  # formula and the question of whether paper trading charges this at all —
  # every figure surfaced from this rate is a labelled ESTIMATE. First
  # measurement 2026-09-18: a -$915.83 debit carried overnight 09-17 -> 09-18
  # produced ZERO broker `INT` activity rows on a query proven live in the
  # same probe, i.e. paper did NOT charge it that night. One night on a small
  # balance is not proof, the ESTIMATE label stays, and nothing gates on it.
  margin_interest_rate_pct: 6.25
  # --- Spec §11.2 — the gross-exposure ceiling (owner-ratified 2026-09-01)
  #
  # Gross exposure = long market value + ABSOLUTE short market value, as a
  # MULTIPLE of equity. Before this setting there was no gross-exposure cap
  # in the codebase at all — max_portfolio_risk_pct bounds capital AT RISK
  # (the sum of stop distances), not exposure. Nothing stopped the book reaching the
  # broker's full 4x. This is a NEW CEILING, i.e. a tightening.
  #
  # It is enforced in two places, both deterministic Python and never as an
  # instruction to an agent: the SIZING gate (portfolio_constructor shrinks
  # or refuses entries that would breach it) and the EXECUTION gate
  # (risk engine hard-block `max_gross_exposure`).
  #
  # The cash-sweep vehicle (cash_sweep.symbol, e.g. SGOV) does NOT count as
  # exposure — it is parked cash, and counting it would consume the whole
  # allowance doing nothing.
  #
  # 2.0x applies day AND night. There is deliberately no lower overnight
  # ceiling: it would force a trim into every close, selling on a clock
  # rather than on merit. The overnight cushion comes from the de-levering
  # ladder instead (src/risk/rules.py::resolve_gross_ceiling), which steps
  # the ceiling DOWN as peak-to-trough drawdown deepens:
  #     0% to  -8%  ->  2.0x
  #    -8% to -15%  ->  1.5x
  #   -15% to -20%  ->  1.0x
  #   worse than -20% -> 0.5x, and the owner is alerted
  # The ladder only ever TIGHTENS this number, so lowering it here lowers
  # every rung with it.
  #
  # NOTE: this ceiling does nothing on its own while allow_margin is false —
  # the cash-only rule already binds gross below ~1.0x. It is built FIRST, on
  # purpose: the ceiling must exist before borrowing is switched on.
  max_gross_exposure_x: 2.0
  # Broker maintenance-margin requirement (% of gross), used ONLY to report
  # how far the book could fall before forced liquidation. Enforces nothing.
  # 25 is Alpaca's standard equity requirement; at 2.0x it reads ~33%.
  maintenance_margin_pct: 25
  # --- Stage 3 (shorts) -------------------------------------------------
  # Shorts carry the SAME limits as longs (owner decision 2026-09-17: "Shorts
  # can have the same [limits] as longs"). The former max_single_short_pct
  # (10) and max_gross_bearish_pct (20) were unsourced numbers and were
  # removed: one short is capped by max_position_pct exactly as one long is,
  # and total exposure either way is bounded by max_gross_exposure_x and
  # max_total_position_pct. Owner ruling 2026-10-04: a short gets no extra
  # protection and no different math — the gap haircut was deleted.
  # Kill switch (2026-09-02) — a file whose mere existence halts every order
  # this desk would place, entries AND exits alike. Checked with
  # path.exists() in src/execution/broker.py, before every broker submit/
  # replace call, so an operator stops the desk with `touch data/KILL_SWITCH`
  # (relative to the repo root, same convention as storage.db_path below)
  # and resumes it by deleting the file — no deploy, and it takes effect on
  # the process's very next order attempt even if it was already mid-session.
  # See RiskConfig.kill_switch_path for why this is the one guard that also
  # blocks a risk-reducing order.
  kill_switch_path: "data/KILL_SWITCH"
  # Spec §9.4 "agreement earns size" — RETIRED AS A SIZING RULE 2026-09-14
  # (owner decision). There is deliberately NO key here. The graduated
  # ceiling (risk.agreement_ceiling_pct) scaled permitted risk by the net
  # seat count as max_position_risk_pct x sqrt(n / 5 seats); the sqrt law is
  # the statistics of averaging INDEPENDENT estimates, and this desk's five
  # seats read overlapping evidence, so its one precondition is unmet. The
  # key is REJECTED on load (src/config/__init__.py) so a stale settings.yaml cannot
  # resurrect it silently. What survives is the refusal only: a net score at
  # or below zero refuses the target outright
  # (src/risk/rules.py::agreement_refuses_trade). Above zero, the ratified
  # max_position_risk_pct envelope and the portfolio budget allocator are
  # the only bounds. Agreement still ORDERS which candidates get funded
  # first (rank_verdicts / allocate_risk_budget priority).

# Idle-cash sweep — park cash above the reserve in a T-bill ETF, release it
# automatically before BUYs. The vehicle is cash-equivalent everywhere:
# hidden from every LLM view, excluded from position/exposure math, stopless
# by design, first to liquidate in force_delever. Deterministic, zero-LLM.
# (2026-07-16 forensics: ~84% idle cash for weeks = ~$300/mo risk-free carry
# left on the table; see src/execution/cash_sweep.py.)
#
# 2026-08-19 SGOV/deployable-liquidity fix: SGOV's market value still
# counts toward the cash PM/RM/the pre-trade gate plan against — that is
# correct, because Alpaca credits `cash` as soon as a SELL FILLS ("the
# cash is updated post the SELL trade is filled"), so a filled SGOV
# liquidation funds an equity BUY in the same session. What was missing
# was CONFIRMING that fill before the BUY phase; fund_buys now verifies
# raw cash actually rose and reports only the confirmed increase, and
# ExecutionStage's raw-cash recheck remains the final authority.
# The reserve band stays at 1.0 — an earlier pass raised it to 5.0, which
# treated the symptom and starved the sweep.
#
# 2026-09-17 OWNER MANDATE — SWEEP OFF: "I want 100% invested. I don't want
# anything sitting in T-bills or any other positions that just yield
# interest." With enabled: false the sweep never parks and never funds; any
# SGOV still held is sold whole into cash at the start of the next
# market-hours session (`CashSweeper.release_retired_vehicle`). `symbol` must
# stay set so that release knows what to sell. The flat $500 `min_order_usd`
# is deleted: no broker minimum (Alpaca: fractional from $1, no commission);
# the owner's 0.5% minimum risk per position is the only size floor.
cash_sweep:
  enabled: false
  symbol: "SGOV"        # iShares 0-3mo T-bills; BIL is the fallback choice

# Board item 190 step 1: tolerance band (pp under 100% invested) for the
# `deployment_gap` advisory. Was read from cash_sweep.reserve_pct; same value.
deployment_gap:
  band_pct: 1.0

# Board item 190: the raw-cash reserve band the /account liquidity view
# reports as reserve_usd / cash_above_reserve. RELOCATED here 2026-10-01 out
# of `cash_sweep` — same value — because its reader is the account view, not
# the retired sweep, and leaving it inside the sweep's section invited a
# later cleanup to delete a live display band along with dead code.
cash_reserve:
  pct: 1.0

# 2026-08-19 intraday opportunity-discovery fix — bounded, cheap trigger
# added onto the existing intra_check cadence (every 30 min): a single bulk
# current-session snapshot flags symbols that moved materially since the
# last close; only those (capped, cooldown-deduped) get a real tech_analyst
# call and the normal Specialist -> PM -> AI Risk -> deterministic gate ->
# execution chain. See src/config/__init__.py::IntradayScanConfig.
#
# ENABLED. This comment used to say the scan was left disabled pending
# operator review; the flag below has been `true` since that step was taken,
# and the stale wording was corrected 2026-09-14. Its two thresholds (3% move,
# 3h cooldown) carry no source — see docs/INCIDENT_HISTORY.md, 2026-09-14,
# "the 2026-09-11 audit's unsourced numbers, checked one by one".
intraday_scan:
  enabled: true
  cooldown_hours: 3.0       # min hours between two decisions for the same symbol
  # No name cap and no move threshold: movers are ranked by move / own ATR
  # and sent in that order until llm_cost_circuit's budget refuses.

smart_money:
  # First-party, credentialless SEC Form 4 discovery. The deterministic
  # pre-market refresh caches and filters filings before any LLM call.
  enabled: true
  search_url: "https://efts.sec.gov/LATEST/search-index"
  archives_url: "https://www.sec.gov/Archives/edgar/data"
  data_dir: "data/smart_money"
  user_agent: "QAMC research-intelligence qamc-contact@proton.me"
  request_timeout_s: 15
  refresh_deadline_s: 180
  # The watched-name drain's own budget, after the market-wide pass. Sized
  # from a 2026-09-19 measurement of the watched backlog; derivation at
  # src/config/__init__.py::SmartMoneyConfig.watched_drain_deadline_s.
  watched_drain_deadline_s: 859
  requests_per_second: 8
  # 7 -> 365 on 2026-09-11 — see src/config/__init__.py::SmartMoneyConfig.lookback_days
  # for the full derivation. A year is the real behavioral bound: someone
  # trading on real inside information has no reason to sit on it past a
  # year. Fetch/retention bound only; whether an old observation can
  # support a target is decided by correlation with other current
  # evidence, not by this number.
  lookback_days: 365
  max_filings_per_refresh: 1000
  max_observations: 40
  # Row-retention window for cluster_survivors, not the research cluster.
  # Alldredge & Blank's abstract measures SAME-DAY purchases; "~2 days" is
  # from a secondary summary only (src/data/smart_money_cluster.py).
  cluster_window_days: 2
  min_cluster_owners: 2
  max_external_candidates: 3
  min_external_price_usd: 5
  min_external_avg_dollar_volume_usd: 10000000
  min_external_history_days: 20
  # Routine-versus-opportunistic Form 4 classification
  # (src/data/insider_signal.py). See src/config/__init__.py::SmartMoneyConfig for
  # the evidence basis behind each default.
  insider_calendar_routine_years: 3
  insider_min_cadence_trades: 3
  insider_cadence_min_mean_gap_days: 20
  insider_cadence_max_mean_gap_days: 120
  insider_cadence_max_gap_dispersion: 0.25
  # insider_min_material_sell_fraction REMOVED 2026-09-13 — it was a cutoff no
  # published source measures, and it discarded a band Scott & Xu find
  # significantly positive. The ratio is reported, not gated. See src/config/__init__.py.
  insider_history_retention_days: 1830

nominations:
  # Phase 9 — bounds on how many candidates News/Earnings/Macro may put in
  # front of the Technical responder pass each run. See
  # src/config/__init__.py::NominationConfig and docs/QAMC_REMEDIATION_SPEC.md §9.1.
  max_per_seat_per_run: 3
  max_total_per_run: 6

universe_screen:
  # Universe expansion and pruning (src/universe_screen.py; design agreed
  # with the owner 2026-09-01, built 2026-09-19). OFF until the mechanical
  # setup funnel lands - owner 2026-10-09. Off = no weekly screen, no screened symbol in any
