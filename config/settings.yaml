  # config/number_ledger.yaml.
  # Separately, src/universe_daily.py (owner ruling 2026-10-09, step A) runs the
  # same checks over every listed name once per trading day after the close and
  # RECORDS each verdict under <data_dir>/daily/. Record-only: it admits and
  # removes nothing and does not read 'enabled'. It reuses data_dir,
  # screen_deadline_s and bars_batch_size (symbols per bar request).
  enabled: false
  data_dir: "data/universe"
  min_price_usd: 5
  min_market_cap_usd: 30000000
  screen_deadline_s: 900
  bars_batch_size: 50

news:
  # Max items placed in the news analyst's prompt after dedup (see
  # src/data/news.py RSS_FEEDS and NewsDataProvider.format_for_prompt).
  # Widened from 8 to 11 free RSS sources on 2026-08-29 (audit comment
  # block in src/data/news.py); this cap intentionally did NOT move with
  # it, so prompt size stays bounded no matter how many wires are
  # configured. 50 is the pre-existing behavior (the old hardcoded default).
  max_prompt_items: 50
  # Per-symbol Yahoo Finance RSS (2026-08-30 owner decision — see the
  # "CHECKED AND REJECTED" audit note in src/data/news.py). Scoped every run
  # to held positions + admitted candidates, never the full ~101-symbol
  # universe. See src/config/__init__.py::NewsConfig for the evidence behind each
  # default below.
  per_symbol_enabled: true
  per_symbol_max_symbols: 15
  per_symbol_max_prompt_items: 15
  per_symbol_requests_per_second: 2.0

macro:
  # FRED fetch resilience (src/data/macro.py). Production evidence
  # 2026-08-26 17:01:29-17:03:49 UTC: all nine FRED series failed in ONE
  # run with "The read operation timed out" under the old single-retry /
  # flat-2s-backoff policy. total_fetch_deadline_s is the actual hard
  # ceiling on added wall-clock (requests and backoff sleeps are clipped
  # to it); the retry/backoff settings are the best-effort recovery layer
  # underneath that ceiling. See src/config/__init__.py::MacroConfig for the
  # reasoning behind each default.
  request_timeout_s: 15.0
  max_retries: 2
  retry_backoff_base_s: 2.0
  retry_backoff_max_s: 8.0
  retry_backoff_jitter_s: 1.0
  breaker_after_failed_series: 1
  total_fetch_deadline_s: 90.0
  # Freshness has NO setting here on purpose (2026-09-11). It used to be a
  # calendar-day threshold in code, and any replacement number would have
  # been just as arbitrary — FRED's daily series run about two business
  # days behind, CPI and payrolls are monthly, GDP quarterly, so no single
  # day count can be right for all of them. The provider now derives each
  # series' expected next print from that series' OWN observed cadence and
  # its OWN publication lag (FRED metadata), and reports whether the held
  # reading is the latest published one or whether a newer print is
  # overdue. Nothing left to tune: see src/data/macro.py::SeriesFreshness.

event_risk:
  # Scheduled-event lookups that ground the Risk Manager's mandatory
  # `event_risk` check (src/data/event_calendar.py). Before this existed the
  # check was answered from the model's own memory: the earnings-date fetcher
  # had zero callers and no macro release calendar was fetched at all.
  # The FRED retry/backoff policy is NOT repeated here — the calendar hits the
  # same host as the macro feed, so the `macro:` settings above are threaded
  # into it. Only the ceilings below are event-calendar-specific. See
  # src/config/__init__.py::EventRiskConfig for the reasoning behind each default.
  horizon_days: 10
  calendar_deadline_s: 20.0
  earnings_deadline_s: 20.0
  earnings_symbol_timeout_s: 8.0
  # FOMC meeting dates come from the Federal Reserve's own free calendar
  # (structured JSON first, the rendered calendar page only as a fallback when
  # that feed's schedule stops short of the horizon — it ends with the calendar
  # year). Different host from FRED, so its own timeout and retry count; the
  # backoff curve is still the `macro:` one. The cache exists because FOMC
  # dates change roughly twice a year, and a stale cache is served labelled,
  # never silently.
  fomc_request_timeout_s: 10.0
  fomc_max_retries: 2
  fomc_deadline_s: 15.0
  fomc_cache_ttl_days: 7.0
  fomc_cache_path: "data/fomc_calendar.json"

