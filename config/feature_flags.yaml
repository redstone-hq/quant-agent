    decided: "2026-08-25"
    source: "commit 6e4f0d077; config/settings.yaml:1422"

  - id: src.config.EvolutionConfig.enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Quarterly prompt auto-evolution explicitly turned on (pre-QAMC, upstream
      yebof commit; QAMC's own history starts 2026-08-09, so this predates the
      desk's current owner but the commit message states the intent plainly).
    decided: "2026-04-23"
    source: "commit f3e5537a0 (#38); config/settings.yaml:1493"

  - id: src.config.EvolutionConfig.dry_run
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      Safety default so a piggybacked reflection cannot auto-commit an
      unreviewed, polite-but-reversed prompt edit straight to git; proposals
      are staged to proposed_edits.json for an operator to read first
      (pre-QAMC, upstream yebof commit).
    decided: "2026-05-13"
    source: "commit c8caaf3d; src/config/llm_cost.py:84-89"

  - id: src.config.EvolutionConfig.auto_commit
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      Only meaningful once dry_run=false; commits each applied prompt edit so
