  - id: src.config.NotificationsConfig.risk_only
    effective_value: false
    code_default: false
    intentional: true
    reason: >-
      Per-category Telegram mute. Declared off: the live switch is the
      TELEGRAM_RISK_ONLY env var on the box, and this registry row exists so
