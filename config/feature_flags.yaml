    decided: "2026-08-30"
    source: "commit 0b6fc18cf; config/settings.yaml:1181-1187"

  - id: src.config.AlpacaConfig.paper
    effective_value: true
    code_default: null
    intentional: true
    reason: >-
      "Paper is the current execution environment and safety authorization,
