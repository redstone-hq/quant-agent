    decided: "2026-08-25"
    source: "commit 6e4f0d077; config/settings.yaml:1421"

  - id: src.config.LLMCostCircuitConfig.require_telegram_alerts
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      Same commit as the cost circuit's own enable: an operator must be
