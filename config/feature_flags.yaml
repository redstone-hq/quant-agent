      (pre-QAMC, upstream yebof commit).
    decided: "2026-04-20"
    source: "commit e84e5f3d; src/config/llm_cost.py:78-81"

  - id: src.config.LLMConfig.structured_output
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      OpenRouter constrained to the agent's own pydantic result schema via
