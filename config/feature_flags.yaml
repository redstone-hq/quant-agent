# The feature-flag ledger -- where every boolean switch's effective value
# came from, and whether anyone chose it.
#
# WHAT THIS FILE IS. `congress_enabled` (SmartMoneyConfig, added 2026-09-04,
# #271) shipped `False`, "off by default, opt in after review", and was never
# switched on. That is a legitimate state for a switch to be in. What made it
# a defect: nothing checked that its declared state (off) still matched three
# owner-facing descriptions of it as RUNNING -- the Telegram smart-money label
# ("the insider-and-congressional-trading feed", src/notifier.py), the
# pre-market refresh log line ("SEC Form 4 + congressional", src/pipeline.py),
# and docs/qamc_trading_desk_workflow.html. Nobody noticed for five weeks
# because there was NO MECHANICAL CHECK that a switch existed, that its state
# was declared, or that the declaration was still true.
#
# `src/feature_flags.py` enumerates every boolean field on every
# `src.config.*Config` class and requires each one to appear here with its
# EFFECTIVE value -- `config/settings.yaml` layered over the pydantic default,
# resolved the identical way `src.config.load_config` builds `AppConfig`.
# `tests/test_feature_flags.py` fails `pytest` (the check branch protection
# requires) when a switch is undeclared, a declaration's value has drifted
# from the live one, or a declaration points at a switch that no longer
# exists. Read `src/feature_flags.py`'s module docstring for the scope rule
# and for what this structurally cannot catch -- in particular: it cannot
# read a Telegram label or an HTML page and check that it agrees with a
# switch. That is still a human documentation pass, not a mechanical one.
#
# WHAT THIS FILE IS NOT. It is not evidence that any `reason` below is
# correct -- only that one was written down. Where git history and the
# code's own comments recorded nothing, `reason` is the literal string
# "reason not recorded" rather than an invented rationale. That string is
# itself a finding to act on, not a placeholder waiting to be filled in by
# whoever next edits the row.
#
# FIELDS.
#   id              -- `src.config.<ConfigClass>.<field>`.
#   effective_value -- the live boolean: config/settings.yaml's value for
#                      that section+key if present, else the pydantic field
#                      default. Checked against the real config on every run.
#   code_default    -- the pydantic field's own default, or `null` when the
#                      field is required (no default at all: `paper`,
#                      `require_stop_loss`). Recorded for readability only;
#                      the gate checks `effective_value`, not this.
#   intentional     -- true when a decision to set it this way is on record
#                      (a commit, a docstring, an owner ruling); false when
#                      the state is an artifact nobody chose (a scaffolding
#                      default that was never revisited, a mechanical sync
#                      of a hand-edited box).
#   reason          -- one line, or "reason not recorded".
#   decided         -- YYYY-MM-DD from `git log -S`/`git blame`, or `null`.
#   source          -- a commit hash, PR number, or `path:line` a reader can
#                      open. Never prose alone, same falsifiability rule as
#                      config/number_ledger.yaml's `source` field.
#
# HOW TO ADD A FLAG. Do not invent a reason. If `git log -S "<field_name>"`
# and `git blame` on its config/settings.yaml line give nothing, and the
# field carries no explanatory comment or docstring in src/config/__init__.py, write
# "reason not recorded" and leave `decided`/`source` null. That is honest;
# guessing is not.

flags:
  - id: src.config.SmartMoneyConfig.congress_enabled
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      Deliberate dark-deploy: two single-operator, no-track-record free
      sources cross-checked against each other, shipped off so an operator
      opts in after reviewing the PR. THE FINDING: it has stayed off for the
      five weeks since with no re-review, while src/notifier.py's smart-money
      label, src/pipeline.py's refresh log line, and
      docs/qamc_trading_desk_workflow.html all describe it as running. This
      is the switch the CI check in this file was built for.
      2026-09-19: rebuilt ahead of the owner's review to read incrementally
      (each disclosure processed once; unchanged files not re-downloaded),
      with a per-source cache manifest, stale copies labelled with their
      age, a recorded refresh count, and health-report patterns.
      2026-09-20: switched ON per owner ruling 2026-09-19 (see
      docs/INCIDENT_HISTORY.md, that date) — congressional evidence must be
      weighted by the PM, never zeroed out on research grounds. Weighting
      was brought into line with that ruling first: a pure-congressional
      finding can never reach "actionable" (confirmatory ceiling only, so a
      same-day cluster of members lifts conviction at most one step, not
      compounding per member) and still cannot alone admit a new symbol
      (`transient_admission_eligible` stays false for it).
    decided: "2026-09-20"
    source: "owner ruling 2026-09-19; docs/INCIDENT_HISTORY.md 2026-09-20 entry; src/config/smart_money.py:142"

  - id: src.config.CashSweepConfig.enabled
    effective_value: false
    code_default: false
    intentional: true
    reason: >-
      Owner mandate, verbatim in the settings.yaml comment: "I want 100%
      invested. I don't want anything sitting in T-bills or any other
      positions that just yield interest." Off since.
    decided: "2026-09-17"
    source: "commit f25ddfd86; config/settings.yaml:1095-1101"

  - id: src.config.ExecutionConfig.repeg_enabled
    effective_value: false
    code_default: false
    intentional: true
    reason: >-
      Master switch for the single-shot entry reprice, deployed dark by
      design ("the owner owns this switch" -- src/config/__init__.py docstring). Per
      standing instruction this switch stays off and is not to be
      re-proposed for enabling.
    decided: "2026-08-28"
    source: "commit 0b2982d0; src/config/llm.py:279-282"

  - id: src.config.ExecutionConfig.rotation_enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Automatic opportunity-cost rotation shipped off, then deliberately
      turned on and filed as a board item once reviewed.
    decided: "2026-09-12"
    source: "commit 03f865402 (#318); config/settings.yaml:286"

  - id: src.config.ExecutionConfig.rotation_ranked_margin_enabled
    effective_value: false
    code_default: false
    intentional: true
    reason: >-
      Board item 39, attempt 3. The sequencing defect this tier had - a
      rotation SELL firing ahead of a replacement BUY that a downstream gate
      then refuses, leaving the desk sold out of a position with nothing
      bought - is closed by a projected post-sale gate plus a clearance
      object the sale cannot be built without. The tier is still OFF, and
      NOT because the switch is being left untouched out of caution: item
      39(a) is unresolved. The margin that decides when this tier fires,
      ROTATION_MARGIN_PCT, is recorded in config/number_ledger.yaml as
      `arbitrary`, and turning this on would make an unmeasured number the
      sole reason for selling a position whose thesis is intact. The
      sequencing work is a prerequisite for that decision, not a substitute
      for it. This flag turns on when 39(a) is answered, and not before.
    decided: "2026-09-20"
    source: "board item 39; config/settings.yaml (execution section)"

  - id: src.config.ExecutionConfig.fractional_enabled
    effective_value: false
    code_default: false
    intentional: true
    reason: >-
      Owner ruling 2026-10-15: whole shares only. Alpaca carries a fractional
      order only as DAY, so a sub-share remainder had no stop overnight; this
      supersedes the 2026-09-02 acceptance of that exposure.
    decided: "2026-10-15"
    source: "owner ruling 2026-10-15; config/settings.yaml (execution section)"

  - id: src.config.ExecutionConfig.fill_stream_enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Code default is off because the socket had never once authenticated
      (1,017 auth failures, zero successes) — a placeholder credential
      literally containing the word "placeholder". Turned on in settings.yaml
      once the real credential was delivered and the auth failure was
      root-caused and verified fixed. The code default staying False is
      itself intentional: it is the safe fallback if credentials regress.
    decided: "2026-09-18"
    source: "commit a938e13ef (#517); config/settings.yaml:401"

  - id: src.config.RiskConfig.allow_margin
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Code default is the conservative cash-only mode ("margin leverage
      amplifies drawdowns and is not the bot's intended mode unless
      explicitly opted in" -- src/config/__init__.py docstring). Flipped on in
      settings.yaml as a deliberate opt-in.
    decided: "2026-09-02"
    source: "commit a82f761e5; config/settings.yaml:989; src/config/__init__.py:372-376"

  - id: src.config.RiskConfig.require_stop_loss
    effective_value: true
    code_default: null
    intentional: false
    reason: >-
      Per-stock protective stops are the sole loss-protection mechanism after
      the account-level loss-halt was deleted (board item 32, owner ruling
      2026-09-20). Requiring a stop on every position prevents the desk from
      holding unprotected downside.
    decided: null
    source: null

  - id: src.config.IntradayScanConfig.enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Raised by hand on the production box on 2026-08-28 "to end that day's
      outage" and later reconciled into git so the repo matched the running
      system; not a from-scratch feature decision, but a recorded, deliberate
      change with a stated cause.
    decided: "2026-08-28"
    source: "commit 1bfe0d775; config/settings.yaml:1119"

  - id: src.config.SmartMoneyConfig.enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      SEC Form 4 smart-money seat turned on as part of shipping the feature
      that reads it (transient admissions).
    decided: "2026-08-25"
    source: "commit b1944cd08; config/settings.yaml:1127"

  - id: src.config.UniverseScreenConfig.enabled
    effective_value: true
    code_default: false
    intentional: true
    reason: >-
      Turned on 2026-10-14 by the owner's yes to the ranked morning scan
      (checklist "Should we build a morning scan"): each morning the
      nightly-filter passers are sent to the AI in score order after held,
      SEC-admitted and configured names, and every one left out is recorded
