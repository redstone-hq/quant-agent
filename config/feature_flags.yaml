    decided: "2026-09-14"
    source: "commit 3c4d4fdb9 (#412); config/settings.yaml:151"

  - id: src.config.NewsConfig.per_symbol_enabled
    effective_value: true
    code_default: true
    intentional: true
    reason: >-
      Per-symbol Yahoo Finance RSS scoped to held positions + admitted
      candidates, owner decision after a "checked and rejected" audit of the
