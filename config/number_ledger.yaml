  - id: src.risk.exit_guard.BREAK_CONFIRMATION_ATR_MULTIPLE
    settles_by:
      kind: recording
      state: specified
      where: docs/board_notes/item-090.md (item 90, the 2026-10-01 tranche-five pass over src/risk)
      records: >-
        every structural break evaluation in `check_structural_protection`, each emitting
        `rule=break_confirmation_margin` with the margin as an ATR multiple, the level tested, whether
