  - id: src.risk.trailing.CHANDELIER_ATR_MULTIPLE
    value: 3
    status: sourced
    site: src/risk/trailing.py
    source: >-
      The Chandelier Exit's published default multiple is 3.0 -- Chuck LeBeau,
      the indicator's originator -- documented by StockCharts ChartSchool
      (https://school.stockcharts.com/doku.php?id=technical_indicators:chandelier_exit)
      and Corporate Finance Institute
      (https://corporatefinanceinstitute.com/resources/wealth-management/chandelier-exit/).
      NUANCE: only the MULTIPLE (3.0) is sourced, not the whole formula. The
      desk's fallback trail multiplies this by a PASSED-IN ATR off the
      highest-high / lowest-low since entry (src/risk/trail_evaluate.py::evaluate_trailing_stop,271),
      NOT the published indicator's fixed 22-bar lookback and ATR(22); so the
      3.0 multiple carries this citation, the surrounding geometry does not.
  - id: src.risk.trail_tick.MIN_RATCHET_TICKS
    value: 1
    status: instrument
    site: src/risk/trail_tick.py
    source: >-
      SEC Rule 612 (Regulation NMS, 17 CFR 242.612), the minimum pricing
      increment: no order may be priced in an increment smaller than
      $0.01 at or above $1.00, or $0.0001 below $1.00.
      https://www.ecfr.gov/current/title-17/section-242.612 ONE tick is
      not an appetite: two prices less than one increment apart are the
      SAME price once the venue quantizes them, so a sub-tick amend
      cannot change the resting stop at all. The count is 1 because that
      is the smallest difference that is a difference; any larger count
      would be a picked churn appetite, which is what this retired.
    note: >-
      RETIRED AND REPLACED 2026-10-02. The 2% floor (MIN_RATCHET_PCT = 2.0)
      is GONE. A proposed stop must now clear the live stop by one VENUE
      TICK -- the smallest price increment the venue will accept, Alpaca's
      published $0.01-at-or-above-$1 / $0.0001-below split (SEC Rule 612),
      the same split `src/execution/broker_parts/stop_amend_pure.py::_quantize_price`
      and `src/execution/stop_records.py::_prices_match` already carry.
      DERIVATION: two prices less than one tick apart are the SAME stop
      after the venue quantizes them, so a sub-tick amend cannot improve
      protection by construction; the floor is a reading off the instrument,
      not a chosen appetite. The condition this entry itself named for
      retirement has fired: `_amend_resting_stop_price` is on main (verified
      against origin/main 2026-10-02), so a stop move is an atomic in-place
      amend with no instant of naked protection, which was the ONLY
      surviving cost defending the percentage gate.
      REJECTED ALTERNATIVES. (a) No minimum at all -- rejected: with no
      floor a proposal a hundredth of a cent above the live stop quantizes
      to the same price, so the desk would amend a resting order to the
      price it already rests at, spending a broker call and an
      owner-visible "stop moved" line for a stop that did not move.
      (b) A smaller percentage (0.5%, 1%) -- rejected as the identical
      failure to the 2.0 it would replace: a picked constant, and one that
      still demands a ratchet three times larger on one name than another
      when expressed in each name's own ATR (measured 2026-09-30, below).
      (c) k x ATR -- already measured and failed 2026-09-30, below.
      COSTS MEASURED, not assumed. Money: zero (commission-free US equity
      orders; an amend crosses no spread and prints no fill). Rate limit:
      nothing on the stop path counts or budgets requests -- the only 429
      handling in src/execution is the trade-stream reconnect -- and the
      deterministic trail runs once per session per position, so the amend
      count is bounded at one per position per session whatever the floor
      is; a floor cannot reduce a bound of one. Rejection: an amend the
