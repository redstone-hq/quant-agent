      does pass `correlation_matrix`, which is built for real by `_ensure_correlation_matrix` on two live stages
      (`src/stage_risk.py` line 601 and `src/stage_decision.py` line 168). Do NOT record this as 'never consulted'
      and do NOT delete it on that basis.
      It is also a DIFFERENT QUANTITY from `RiskConfig.max_cluster_risk_share_pct` (40) despite both being called a
      cluster cap: 50 is a share of gross NOTIONAL book value, computed as (peer_value + gross_new) / total_value
      with the gross multiplier applied, and it only appends an advisory `correlation_cluster` violation; 40 is a
      share of the committed RISK budget and is enforcing. The two cannot be reconciled to one number and neither
      derives the other. Method: static call-graph read of the only production caller plus the input suppliers,
      2026-10-04. Not settled: nothing records how often the advisory fires, so its firing rate against live book
      geometry is still unmeasured, and that counter is what this row waits on.
    settles_by:
      kind: recording
      state: specified
      where: docs/board_notes/item-090.md (item 90, the 2026-10-01 tranche-five pass over src/risk)
      records: >-
        each session's correlation clusters as the distance tree cuts them, with every cluster's share
        of gross notional and whether this advisory cap was exceeded, recorded alongside what the desk
        then did with the names in that cluster
      closes_when: >-
        a run of sessions shows the cluster shares the book actually reaches, so the cap is set against
        observed crowding. SEPARATE AND FIRST: the code calls this cap advisory, so the recording must
        also show whether anything acts on the violation; if nothing does, the honest route is to say
        so and either wire it up or delete it, not to tune an advisory number
    value: 50
    status: arbitrary
    site: src/risk/rules.py
    note: >-
      Correlated-cluster advisory cap: a BUY whose |corr|>=0.7 cluster would
      exceed 50% of the book raises an advisory violation
      (src/risk/rules.py::RiskRuleEngine.check). The one caller (src/pipeline.py::TradingPipeline._run_morning_body)
      passes nothing, so the default is live. Advisory (absent from
      HARD_BLOCK_RULES, src/pipeline_config_build.py::_threaded_risk_settings), but advisories reach the risk
      seat.
    open_question: >-
      What share of the book in one correlated cluster does the ratified per-
      trade and portfolio risk envelope actually permit, and should this cap
      be derived from max_cluster_risk_share_pct rather than set separately?
    cost_while_unanswered: >-
      The risk seat is told a cluster is too large at a line nothing backs,
      and a second, different cluster cap (40% of RISK) exists beside this one
      (50% of NOTIONAL).
    correction_2026_10_02: >-
      TWO CITATIONS IN THE `note` ABOVE ARE FALSE AND ARE CORRECTED HERE
      RATHER THAN LEFT TO BE RE-DISCOVERED. (1) "The one caller
      (src/pipeline.py::TradingPipeline._run_morning_body)" -- the one production caller is now
      src/pipeline_risk_gate.py::RiskGate._filter_hard_risk_decisions; it still passes nothing, so the finding
      that the default is the live value STANDS, but the path given for it
      does not exist. (2) "src/pipeline_config_build.py::_threaded_risk_settings" for HARD_BLOCK_RULES is the
      same stale path; the rule set is defined at src/risk/rules.py::RiskRuleEngine.check
      and `correlation_cluster` is absent from it, so the advisory claim also
      stands. The rule body is at src/risk/rules.py::RiskRuleEngine.check, not 1700-1740.
      WHAT WAS CHECKED AND DELIBERATELY NOT CHANGED. The obvious repair --
      wire `max_cluster_risk_share_pct` (40) through to this parameter so one
      configured number governs both -- was examined and REJECTED as a
      category error, and this is recorded so the next pass does not re-make
      it. The two caps measure different quantities in different units:
      src/risk/rules.py@`cluster_pct = (peer_value + gross_new) / total_value * 100` computes `cluster_pct` as
      `(peer_value + gross_new) / total_value * 100`, a share of GROSS
      NOTIONAL, while `max_cluster_risk_share_pct` is a share of the RISK
      budget consumed by a cluster (src/portfolio_constructor/__init__.py::PortfolioConstructor._plan_risk_targets).
      Feeding the risk share into the notional test would silently tighten a
      live advisory on an arithmetic confusion. The row stays `arbitrary` and
      its recorded settlement route is unchanged.
