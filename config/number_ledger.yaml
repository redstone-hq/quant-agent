  - id: src.verdicts.SEAT_WEIGHT['earnings']
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/item-090.md (the 2026-10-01 eighth routing tranche)
      records: 'the forward discriminating power of the earnings seat''s own signal, measured on public
        data over the universe the desk could trade, on public daily bars and NOT on this desk''s
        fills: the difference in forward move between names the seat called favourably and names it
        did not, over a stated horizon, for every seat on the same footing'
      closes_when: every seat carries a measured discriminating power and the weights are restated
        as their ratio; the WHOLE dict is DELETED, and the score becomes an unweighted mean, if no
        seat separates from another beyond sampling error -- the spacing here is load-bearing, because
        these weights are summed into a score compared ACROSS candidates, not used as positions in
        a sort key
    value: 1.2
    status: arbitrary
    site: src/verdicts.py
    note: >-
      Per-seat ranking multiplier. The DIRECTION is genuinely sourced -
      src/verdicts.py::SEAT_WEIGHT cites five WebSearch-verified literature reviews
      of 2026-09-03 and docs/QAMC_REMEDIATION_SPEC.md section 13.3 for the
      per-seat citation list, here post-earnings-announcement drift (Ball &
      Brown 1968; Bernard & Thomas 1989/1990). The MAGNITUDE is not: nothing
      in that literature sets the spacing at 0.2. By this desk's own rule a
      source for a direction is not a source for a point value, so it is
      recorded honestly as arbitrary rather than as sourced.
    open_question: >-
      What relative weight does the published effect size for the earnings
      seat imply, and does it survive the conviction ledger's own
      20-resolved-call bar once this desk has that sample?
    cost_while_unanswered: >-
      Ranking decides which names get taken when the book is full, so a wrong
      spacing silently reorders the book; src/verdicts.py@`The amendment: use a real, externally published prior now, on outside literature about the general reliability of each TYPE of analysis (not a claim about how good THIS desk's specific analyst prompts are) — and let it be overridden the moment the desk's own conviction ledger clears the 20-resolved-call bar per seat` already
      commits to overriding it with measured history.
