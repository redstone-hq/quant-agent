  - id: src.data.context._SLOPE_LOOKBACK
    value: 10
    site: src/data/context.py
    status: arbitrary
    note: >-
      Sessions over which each moving-average slope is called rising or
      falling. The resulting direction enters the Technical prompt and the
      same count extends the screen's minimum-history requirement.
    open_question: >-
      What current-instrument window makes moving-average direction stable
      enough to report without imposing the same flat duration on every name?
    cost_while_unanswered: >-
      The Technical seat sees a trend direction and the screen requires extra
      history using a flat, unmeasured calendar count.
    settles_by:
      kind: measurement
      state: specified
      where: >-
        config/number_ledger.yaml, the settlement route on
        src.data.context._SLOPE_LOOKBACK
      records: >-
        slope direction across candidate windows on public bars for the
        tradable universe, alongside each name's present volatility and the
        persistence of that direction rather than this desk's selected trades
      closes_when: >-
        the window is reformulated from the instrument's current structure or
        volatility, or the direction field is removed if no stable
        instrument-relative formulation exists
  - id: src.data.context._CONSOLIDATION_WINDOW
    value: 14
    site: src/data/context.py
    status: arbitrary
    note: >-
      Minimum sessions admitted as a consolidation. It currently equals the
      ATR period in source, but equal values do not establish that volatility
      estimation and base duration are the same market quantity.
    open_question: >-
      How can the start of the current base be read from the instrument's own
      price structure without imposing a flat minimum duration?
    cost_while_unanswered: >-
      The Technical seat can be told that a base exists or does not exist
      because of a duration borrowed from an unrelated volatility estimator.
    settles_by:
      kind: measurement
      state: specified
      where: >-
        docs/board_notes/item-090.md, the 2026-10-05 context-and-ranking
        coverage repair
      records: >-
        candidate base starts supplied by present-instrument pivots and range
        containment, with the resulting span and volatility description, but
        never this desk's later trade return
      closes_when: >-
        consolidation duration is read from the current instrument's detected
        structure and the fixed minimum is removed, or the field is removed if
        no structure-defined start can be stated
  - id: src.data.context._MAX_GAPS_REPORTED
    value: 3
    site: src/data/context.py
    status: arbitrary
    note: >-
      Rendering cap on unfilled gaps shown to the Technical seat, nearest
      first. It is not a deterministic trade gate, but it changes evidence the
      seat receives and therefore can change a verdict.
    open_question: >-
      How many unfilled gaps can be omitted before the missing level changes a
      Technical answer, within the prompt's measured evidence budget?
    cost_while_unanswered: >-
      A material older gap can be hidden from the analyst while a less useful
      nearer gap consumes the fixed allowance.
    settles_by:
      kind: measurement
      state: specified
      where: >-
        docs/board_notes/item-090.md, the 2026-10-05 context-and-ranking
        coverage repair
      records: >-
        controlled replays of an identical cached market context with the full
        gap list and each successively truncated rendering, including prompt
        token count and any change in extracted Technical facts or verdict
      closes_when: >-
        the cap is derived arithmetically from an explicit prompt-token budget,
        removed when the full list fits, or replaced by a rendering proven
        invariant in controlled replay without consulting trade outcomes
