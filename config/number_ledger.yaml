  - id: src.data.event_calendar.earnings.EARNINGS_EVENT_WINDOW_SESSIONS
    value: 3
    status: not-trade-governing
    site: src/data/event_calendar/earnings.py
    note: >-
      Sessions-to-earnings inside which a scheduled report is CALLED
      imminent. Measured at both call sites on 2026-10-05: it formats the
      "INSIDE THE N-SESSION EVENT WINDOW" phrase in
      `EarningsProximity.describe()` (prompt text a seat reads) and filters
      which held names the evening owner report lists under "reports soon"
      (`src/trader_feed/evening.py`). No Python path sizes, prices, stops,
      buys or sells a position from it. Nothing on the desk refuses a trade
      because earnings are NEAR: `EventRiskConfig` holds only fetch timeouts,
      retries, a cache age and the look-ahead horizon, and the one event
      refusal is `src/pipeline_earnings_refusal.py`, which refuses a BUY only
      when a just-filed report reached the session UNREAD. Informational, not trade-governing. HONEST CAVEAT, not
      softened: the value 3 itself has no measurement behind it, and because
      an LLM seat reads the phrase it can still colour a verdict. It is
      recorded here as informational rather than `arbitrary` only because
      nothing mechanical depends on it, and it should be re-examined the
      moment any code branches on this window.
