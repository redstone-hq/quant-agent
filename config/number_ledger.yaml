        the wall-clock ET minute at which the stage started and finished, and
        for the pre-open window the publication minute of every earnings
        release the desk consumed that morning.
      records: >-
        the start and finish minute of every scheduled stage run, and the
        publication minute of each consumed pre-market earnings release, so a
        window bound can be read off the observed tail of those distributions
        instead of chosen as a round clock time, and so an overrun or a missed
        release is counted rather than assumed rare.
      closes_when: >-
        the recording has covered enough sessions to show the distribution of
        stage finish minutes and release publication minutes, at which point
        each bound is re-derived from its own tail and this row is replaced by
        a measured value or by a read-at-run-time rule. The backtest engine
        cannot close it: that engine steps daily bars and models no intraday
        session clock, so these minutes never reach code it runs.
