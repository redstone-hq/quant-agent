  - id: src.execution.broker_parts.stop_place._STOP_PLACEMENT_MAX_ATTEMPTS
    value: 3
    status: arbitrary
    site: src/execution/broker_parts/stop_place.py
    note: >-
      Retry ceiling for placing the protective stop immediately after an
      entry fills (src/execution/broker_parts/stop_place.py::_STOP_PLACEMENT_MAX_ATTEMPTS). docs/WORK.md item
      129: the stated reasoning -- that a failure surviving three attempts
      must be a rejection rather than a transient fault -- is falsified by
      2026-09-16 (item 127), where a transient concurrency conflict
      survived all three attempts and was not a rejection.
    open_question: >-
      What attempt count and backoff would this class of transient failure
      (rate limit, 5xx, dropped connection, fill/order eventual-consistency
      race) actually need to clear, measured against real occurrences
      rather than assumed to clear "in under a second"?
    cost_while_unanswered: >-
      A position can open with no protective stop and reach the owner alert
      -- the "real remedy" the comment names -- while still exposed, on any
      failure class the three-attempt/~2-second budget does not actually
      cover.
    settles_by:
      kind: recording
      state: specified
      where: docs/board_notes/, item 90, the 2026-10-01 sixth routing tranche (execution plumbing and the level scan)
      records: >-
        every protective-stop placement attempt the broker client makes after an
        entry fills: the attempt index, the error class returned (rate limit,
        5xx, dropped connection, fill/order eventual-consistency race, hard
        rejection), the delay waited before it, and whether the following
        attempt succeeded, so the clearing time of each transient failure class
        is read off the broker rather than assumed to be under a second.
      closes_when: >-
        the recording shows, per failure class, the attempt count and the delay
        at which placement actually succeeds, and the ceiling becomes that
        reading for the worst class the desk is willing to wait out. DELETE
        outcome: if no failure class is ever cleared by a retry, the retry
        ladder goes entirely and a placement failure escalates to the
        unprotected-position alert at once, rather than the attempt count being
        re-picked.
