  - id: src.execution.order_gates._FRACTIONAL_QTY_EPSILON
    value: 1.0e-9
    status: not-trade-governing
    site: src/execution/order_gates.py
    note: >-
      Floating-point tolerance used only to tell a genuine sub-share
      remainder from float representation error (src/execution/broker.py:
      1378-1400 docstring on `_split_protective_qty`) before splitting a
      protective stop into a whole-share GTC leg and a sub-share DAY leg.
      It guards against noise at the 1e-9 scale; any value in a wide band
      well below a real fractional remainder (which is never smaller than a
      broker-tradable fraction of one share) produces identical behaviour,
      so this is a precision guard rather than a policy choice.
  - id: src.portfolio_constructor.config._NO_REAL_WEIGHT_DELTA_PCT
    value: 1.0e-9
    status: not-trade-governing
    site: src/portfolio_constructor/config.py
    note: >-
      Floating-point tolerance, added 2026-09-30 (owner ruling, board item
      183) when the picked `min_trade_weight_delta` churn floor (0.5%) was
      DELETED rather than resized. `signed_target` and `current_pct` are
      independent float divisions (a live price against total_value vs. a
      model-typed percent), so a delta the desk did not actually request —
      "hold exactly what is held" — can land a few ULPs off zero instead of
      bit-exact. This recognises that as no request at all, the same role
      `src.execution.broker_parts.stop_place._FRACTIONAL_QTY_EPSILON` plays for share
      quantities; it is nine orders of magnitude below the finest weight a
      model or a human types, so any value in a wide band below that
      produces identical behaviour — a precision guard, not a policy
      choice. It decides nothing about whether or how much to trade: a real
      nonzero delta of any size, however small, is now attempted.
