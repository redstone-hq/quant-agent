  - id: src.agents.llm_retry._BACKOFF_CAP_S
    value: 60.0
    status: sourced
    site: src/agents/base.py
    source: >-
      https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
      -- the "cap" term of the published Full Jitter formula
      `sleep = random(0, min(cap, base * 2 ** attempt))`. The formula is
      unbounded in the attempt index without it; the article treats the cap
      as a required part of the pattern, not an optional tuning knob.
    note: >-
      LLM plumbing, not a trading decision. The VALUE 60s is bounded by
      `_DEFAULT_RETRY_DEADLINE_S` (480s) in the same module: one sleep must
      not be able to consume the primary window on its own. Any value
      comfortably below 480 satisfies the constraint; 60 is the round number
      inside it, and that choice is the arbitrary part -- stated rather than
      dressed up as measured.
