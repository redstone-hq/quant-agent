      The seat's feedback memory is cut at a round number: too short and it
      cannot see a repeating pattern, too long and stale rows steer today's
      decision.
    settles_by:
      kind: "recording"
      state: "specified"
      where: "docs/board_notes/item-090.md (item 90, the 2026-10-01 pipeline tranche)"
      records: >-
