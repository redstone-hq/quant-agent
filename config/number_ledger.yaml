  - id: src.agents.tech_analyst._WEEKDAYS_PER_WEEK
    value: 5
    status: sourced
    site: src/agents/tech_analyst.py
    source: >-
      The definition of the seven-day week: five of its days are
      Monday-to-Friday. Not a market-structure number and not a measurement —
      no market data could change it. Used only to state the technical seat's
      history depth back to it in sessions as well as calendar days (board
      item 168); it is not a lookback, a threshold or a weight, and changing
      it changes no fetch, no indicator and no trade. Consistency with the
      desk's existing weekday counter (src/trading_calendar.py::is_weekday, which
      shares the same Monday-to-Friday assumption rather than independently
      evidencing it) is asserted at
      tests/test_tech_analyst_history_window.py::test_weekday_arithmetic_matches_the_desks_own_session_counter.
  - id: src.agents.tech_analyst._DAYS_PER_WEEK
    value: 7
    status: sourced
    site: src/agents/tech_analyst.py
    source: >-
      The definition of the week: seven days. The denominator of the weekday
      fraction above, checked for consistency at the same site,
      tests/test_tech_analyst_history_window.py::test_weekday_arithmetic_matches_the_desks_own_session_counter. Same scope, same absence
      of any trading effect.
  - id: src.agents.tech_analyst._BARS_PER_SYMBOL
    value: 40
    status: arbitrary
    site: src/agents/tech_analyst.py
    note: >-
      OHLCV bars attached per symbol in the technical seat's prompt
      (src/agents/tech_analyst.py@`TechAnalystAnswer,`). The comment gives only qualitative
      reasoning ("enough for swing pivots... not so many that context
      balloons"); structural levels are computed separately in
      src/data/levels.py, but the recent-bar window itself still shapes
      what the seat reads for micro-structure, and no derivation sets 40
      rather than another figure.
    open_question: >-
      What lookback do swing-pivot and micro-structure reads actually need
      on this desk's traded universe, measured rather than assumed
      sufficient?
    cost_while_unanswered: >-
      A pivot or micro-structure feature older than 40 bars is invisible to
      the seat's immediate-context read.
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/, item 90, the 2026-10-01 sixth routing tranche (execution plumbing and the level scan)
      records: >-
        over the universe the desk could trade, the swing pivots and micro-
        structure features the level scan finds on daily bars at lookbacks of
        20, 40, 60 and 120 bars, and how many of the features present at the
        longest lookback are already present at 40, so the per-symbol bar cap is
        a reading off the instrument rather than a judgement that 40 is enough.
      closes_when: >-
        a lookback exists past which the feature set stops changing materially,
        and the cap becomes that reading. DELETE outcome: if the feature set at
        40 bars is indistinguishable from the feature set at every other
        lookback tested, the bar block is doing nothing for the seat's read and
        the prompt should carry the structural level table alone, with the cap
        removed rather than re-picked at some other round number.
