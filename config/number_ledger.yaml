    site: src/execution/broker_parts/trade_stream_reconnect.py
    note: >-
      Handshake-attempt ceiling for one trade_updates session, derived from
      the equal-jitter curve run off the reconnect min/max above (1, 2, 4,
      8, 16, 30 -- saturates at attempt 6, src/execution/broker_parts/trade_stream_reconnect.py::_STREAM_ATTEMPT_CEILING_PER_SESSION).
      One of three constants added 2026-09-18 to close an unbounded retry
      loop that logged 32,896 handshakes and 32,666 HTTP 429s in one day
      (the `_STREAM_ATTEMPT_CEILING_PER_DAY` constant beside it); none of the three decides, sizes,
      prices or exits a trade -- the bounded REST fill path is unchanged and
      is what runs when this ceiling fires.
