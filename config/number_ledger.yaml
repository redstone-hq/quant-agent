    ruled_on: '2026-09-11'
    ruling_summary: "Owner overrode the single-name notional ceiling to 65% of equity on 2026-09-11 after the prompt_limits defect; a dated appetite call, not a derivation."
    ruling_record: src/portfolio_constructor/config.py, the max_position_pct comment, clause (c) dated 2026-09-11 (owner set 65 as his own risk-appetite call, costs at five real gap disasters recorded beside it); docs/INCIDENT_HISTORY.md, the prompt_limits defect
    site: src/portfolio_constructor/config.py
    note: >-
      Single-name ceiling, moved to 65 by owner override on 2026-09-11
      (docs/INCIDENT_HISTORY.md, the prompt_limits defect). Ratified,
      unsourced.
    open_question: >-
      What single-name NOTIONAL share does the mandate permit, given
      risk-based sizing already caps risk separately?
    cost_while_unanswered: >-
      A round 65 with no derivation. ITEM 222, measured 2026-10-01 against
      the production order record 2026-09-02..2026-09-30: this ceiling is the
      binding single-name constraint and the only one observed to bind -- 4
      of 38 attributable entry orders, every one at a stop tighter than the
      7.69%-of-entry crossover with the 5% risk envelope. The earlier wording
      here, "binds most real trades", was never measured and is wrong: it
      bound 4 of 38, not most.
    route_parked_by_ruling_2026_10_04:
      why: the measurement route below is kept as written but parked, because the owner's dated ruling above settles the value; a ruled number owes no route, and this one is not re-derived.
      kind: measurement
      state: specified
      where: docs/board_notes/item-090.md (item 90, the 2026-10-01 portfolio-constructor tranche)
      records: >-
        the distribution of overnight and intraday gap moves against position, in
        percent of prior close, measured off public daily bars for the eligible
        universe over a stated window -- the no-stop-fill case this ceiling is the
        only guard against. Measured on the instrument, over names the desk could
        have held rather than names it did hold, so it is a property of the tape and
        not of this desk's trade record
      closes_when: >-
        the overnight gap distribution is measured and the ceiling is read off it,
        with NO owner tolerance asked for. The question this row once routed to the
        owner (how much single-name loss he will tolerate when a stop does not fill)
        is WITHDRAWN: a protective stop cannot trigger while the exchange is shut, so
        an overnight gap is whatever the market does and not a tolerance anyone can
        set, as the owner has ruled repeatedly (recorded 2026-10-04 in
        docs/board_notes/item-186.md). The measurement, startable from this entry
        alone: take the daily OHLC bars this repo already fetches for the eligible
        universe (`src.data.market.MarketDataProvider.get_ohlcv_batch`; a recorded
        400-session sample for 33 symbols sits in
        ops/rehearsal/recordings/market_bars.json.gz), compute for every consecutive
        session pair (open_t / close_t-1) - 1, pool the adverse gaps across names,
        and write down the window, the universe, the gap count, the worst gap and the
        gaps at the 1-in-100, 1-in-1,000 and 1-in-10,000 ranks. The ceiling then
        becomes the notional share at which the WORST OBSERVED gap costs the account
        no more than the per-name risk envelope the ledger already carries at
        src.config.RiskConfig.max_position_risk_pct (share = envelope / |worst gap|):
        a derivation from the tape and an existing number, with no percentile picked
        and no tolerance chosen. The per-name reading of the same gap history is the
        build item 186 names and supersedes this pooled bound once it exists. Until a
        measured figure is written down the desk pays a round 65 nobody derived
