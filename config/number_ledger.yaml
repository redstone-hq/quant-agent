    value: 2.5
    status: owner-ruled
    ruled_on: '2026-10-04'
    ruling_summary: "Owner ruled on 2026-10-04 that the minimum stop distance is 2.5 times the stock's own ATR, closing the stop-multiple question at that value; it individualises per name because ATR does."
    ruling_record: docs/OUTCOME.md, sections 'The protective stop width is settled at 2.5 ATR' and 'Every money number is expressed against the stock's own movement' (owner ruling 2026-10-04)
    site: src/config/__init__.py
    route_parked_by_ruling_2026_10_04:
      why: the measurement route below is kept as written but parked, because the owner's dated ruling above settles the value; a ruled number owes no route, and this one is not re-derived.
      kind: recording
      state: built
      where: src/storage/trades/ledger.py
      writes:
        - trades.entry_atr
        - trades.stop_basis
        - trades.max_adverse_excursion
        - trades.max_favourable_excursion
      records: >-
        Per CLOSED trade: entry price, entry ATR, the entry stop and the basis
        it was computed from, and the maximum ADVERSE and FAVOURABLE excursions
        (`trades.max_adverse_excursion` and its favourable mirror, written by
        `src/storage/db.py`), alongside the realised outcome and stop-hit
        category already stored. The realised ATR multiple is RECOMPUTED from
        those columns and is deliberately not stored again.
      closes_when: >-
        Enough closed trades carry the excursion columns to answer the only
        question doctrine allows of them -- was the floor ever VIOLATED in
        practice -- which falsifies the floor or leaves it standing. It may
        NOT be optimised against: fitting a number to this desk's own trading
        record is barred outright (docs/OUTCOME.md), and that is how the 1.5
        was produced in the first place.
        LIVENESS, MEASURED in production on 2026-10-01 and not
        inferred: the columns this route depends on are EMPTY --
        entry_atr, stop_basis, max_adverse_excursion and
        max_favourable_excursion are non-null on 0 of the 80 rows in
        trades. The route is therefore BUILT but has settled nothing,
        and the reason is dated rather than unknown: the entry-side
        write read ATR off the wrong object until it was corrected and
        deployed late on 2026-09-30, and no entry has been written
        since that deploy, so the recording is UNPROVEN rather than
        demonstrated dead. The excursion columns cannot fill
        independently of that: their accumulating UPDATE filters on
        entry_atr IS NOT NULL, so they stay empty for every trade
        entered before the correction. The first entry taken after it
        is the observation that decides whether this route is alive;
        until one exists, no reader may treat the floor as being under
        falsification.
    note: >-
      Minimum stop distance in ATRs where no real level backs the stop, a
      risk-sizing GUARDRAIL (the floor an unbacked stop cannot be tighter
      than), owner-ratified appetite 2026-09-25 (delegated to the adversary) as
      a point WITHIN the published band. The definition site
      (src/config/__init__.py::RiskConfig) carries a real derivation - measured 2026-08-27
      stop/ATR geometry, and a published 2.5-3.0x entry-stop consensus for
      swing holds; the 2-3x band IS sourced, and the effective floor already
      no longer varies: the setup and regime scalers that multiplied into it
      were REMOVED 2026-10-09 per owner ruling 2026-10-04. Ratified, not sourced:
      the published figure is a RANGE and 2.5 is a point inside it, which by
      this desk's own rule is not a source for the point. CORRECTION
      2026-09-18: the first version of this entry attributed the phrase "a
      doctrine-grounded placeholder, not a permanent constant" to this site.
      That phrase is at src/portfolio_constructor/config.py, not here.
      ITEM 90 PASS 2026-09-30, REVISED after an adversary pass found the
      first version of this note asserted a false history. The VALUE is
      unchanged and stays `arbitrary`. What changed: the old open question
      was doctrine-barred and is replaced; a false provenance is deleted;
      and the reformulation route is NOT refused but specified and filed.
      (a) A FALSE HISTORY IS DELETED, NOT SOFTENED. The first version of
      this note, following a wrong comment in config/settings.yaml, said
      the base moved "3.0 -> 1.5 on 2026-09-04" and built an argument on
      it. Read from git instead: config/settings.yaml went 3.0
      (3dff9408, 2026-08-27) straight to 2.5 (0088328c, 2026-09-10) and
      NEVER held 1.5 — `git log --all -S'min_stop_atr_multiple: 1.5' --
      config/settings.yaml` returns nothing. 0088328c is a SQUASH of PR
      #269's three sub-commits; the 1.5 existed only inside that branch,
      between sub-commit one (3.0 -> 1.5, Sweeney MAE) and sub-commit two
      (1.5 -> 2.5, published doctrine). No deployed value was ever 1.5 and
      there was no 2026-09-04 base move.
      (b) THE OLD QUESTION WAS DOCTRINE-BARRED. It read "what in this
      desk's own maximum-adverse-excursion record picks the point inside
      it?" An MAE study over this desk's own trades is FITTING, and
      docs/OUTCOME.md ("No arbitrary numbers, ever", the 2026-09-12
      correction) says fitting a threshold to past outcomes "is not the
      opposite of an arbitrary number; it is an arbitrary number with a
      backtest stapled to it". Answering it as written would have
      re-created the abandoned 1.5, which came from exactly such a fit.
      (c) THERE IS NO CITED BAND, so "the range is sourced and only the
      point is not" — the claim this entry made since 2026-09-25 — is
      WITHDRAWN. This entry carries no `source:` field and never did.
      config/settings.yaml offers only "general swing-trading guidance"
      with no URL, which docs/OUTCOME.md explicitly rejects: "a citation is
      not a number that sounds authoritative — it is a URL a later reader
      can open and check". Searched 2026-09-30 and recorded so nobody
      repeats it: the sources that assert 2.5-3.0x for a fixed multi-day
      entry stop are vendor and content-marketing pages, not literature;
      one secondary claim attributed to Technical Analysis of Stocks &
      Commodities points the OTHER way (1.5-2.0x best risk-adjusted for
      3-15 session swings); Van Tharp's and the Chandelier's 2-3x are
      TRAILING-stop mechanisms, which this file's own comment already
      concedes are "never on a fixed entry stop"; and the top search hit
      for the desk's own phrasing is now the desk's own PR #269, so the
      "published doctrine" is partly self-referential in the index. The
      honest position is that BOTH ends are unsupported, not just the
      bottom, and the band quoted at the definition site (2.5-3.0) does
      not even match the 2-3 quoted three lines below it.
      (d) THE REFORMULATION IS NOT REFUSED. An earlier draft refused it on
      the claim that a `1.0 x ATR x sqrt(horizon)` floor would pin
      reward:risk at exactly 1.0. That arithmetic was wrong twice and is
      retracted: `_stop_atr_multiple` multiplies by a setup and a regime
      scaler, so the ratio would sit at 1/(setup x regime) — about 1.17
      range/risk-on and 0.83 breakout/risk-off, not 1.0; and the two rules
      do not govern one population, since the measured-move target fires
      when no level sits ABOVE entry while this floor fires when no
      5-touch level sits BELOW it, which are independent conditions on
      opposite sides of price. What survives is narrower and is kept as a
      caution, not a refusal: any sqrt(horizon) floor built from the
      target side's own 1.0 makes reward:risk horizon-INVARIANT and always
      near one, where today it rises with the hold.
      (e) THE ROUTE WITH THE MOST MONEY IN IT WAS NEVER TESTED, and is now
      filed as item 199. docs/OUTCOME.md ranks reformulation first and its
      worked example is structural ("does the last higher low still hold?"
      needs no number because the chart supplies the level). This desk
      already computes structural levels with touch counts, and
      `_derive_structural_stop_no_atr` — owner-ratified under item 80 and
      already using the ratified `structural_stop_buffer_pct` — already
      reads a stop from structure; only its trigger condition would
      change. The asymmetry that makes it viable is measured IN THIS REPO
      and is not fitting, because it is measured off bars rather than off
      the desk's own trades: `src/data/levels.py` records pooled bounce
      probability rising from 0.516 at first touch to 0.644 at 5+ touches
      against a flat ~0.48-0.51 shuffled control (7,218 touch episodes,
      101 symbols, 5 years; docs/RESEARCH_FINDINGS.md section 7). The
      5-touch bar exists because below it the real and shuffled intervals
      overlap — which matters when a level justifies a TIGHTER stop, where
      a level that fails costs a whipsaw. As a WIDENING anchor the bet is
      inverted: the stop sits beyond the level, so a level that fails
      leaves the stop merely wider than needed, which under risk-based
      sizing costs a smaller position and NOT a larger loss. A 2-touch
      level (MIN_TOUCHES = 2) still sits above the shuffled control. That
      asymmetry was never examined and it is where this constant's blast
      radius actually shrinks.
      (f) EFFECT ON THE UNIVERSE SCREEN — SUPERSEDED ON MAIN, and the
      correction is recorded rather than re-applied. This pass proposed
      dividing `STOP_SANITY_FLOOR_FRACTION` by
      `widest_reachable_stop_atr_multiple(base)` instead of by the base,
      taking the ceiling from 20% to 16.67%. Board item 185 landed first
      and went further: it deleted the borrowed 0.5 literal outright, so
      the ceiling is now `1 / widest_reachable_stop_atr_multiple(...)` =
      1/3.00 = 33.3%, the arithmetic point at which the widest legitimate
      stop would sit at or below zero. Main's form is kept and this
      branch's narrower form is dropped. What survives from this pass is
      the FINDING, which item 185 confirms: dividing by the bare base was
      false across a band of names, and the divergence was exactly the
      risk-off scaler 1.20. Also withdrawn as wrong on the facts: the
      board's note that the screen fix "needs the owner's call because it
      tightens a live screen" — `universe_screen.enabled` is False in
      config/settings.yaml, so the screen does not ship on.
      ITEM 185, 2026-09-30 — NEW DOWNSTREAM CONSUMERS, and an honest note
      about what that means. This value is now one of three factors in
      `portfolio_constructor.widest_reachable_stop_atr_multiple` (base x
      largest setup scaler x largest regime scaler = 2.5 x 1.00 x 1.20 =
      3.00), which board item 185 made the basis of TWO further rules: the
      midday TRAIL_STOP clamp and the universe screen's ATR/price
      volatility ceiling (1 / 3.00). Those two used to carry a flat 0.5
      literal between them; that literal is deleted and its row is gone.
      Do not read the composition as a derivation. It removes one
      independent arbitrary literal and creates a live dependency on THIS
      row and on `stop_atr_regime_scale[0][1]`, both of which remain
      `arbitrary` with open questions. The arbitrary content of the desk is
      unchanged by item 185; only the number of independent literals fell.
      Board item 185 therefore STAYS OPEN.
      REMOVED 2026-10-09 per owner ruling 2026-10-04 (an unbacked stop is
      2.5 ATR) and owner mandate 2026-10-09 (market mood is a weighted input
      elsewhere, never a stop-width scaler): the setup scaler (range 0.90)
      and the regime scalers (1.20 / 1.10 / 0.95) are deleted, their five
      rows with them. `widest_reachable_stop_atr_multiple` is now this base
      alone (2.5), so the TRAIL_STOP clamp and the screen ceiling (1 / 2.5)
      depend on this row only.
    open_question: >-
      NOT a point-inside-a-band question any more; that framing is
      withdrawn with the band (see note (c) — there is no citation, so
      both ends are unsupported). The answerable question is now whether
      this constant can be reformulated away for most of the names it
      governs, and it is answered by BUILDING item 199, not by a ruling:
      when no 5-touch level backs the stop, does the nearest computed
      level below entry at any touch count (>= MIN_TOUCHES = 2), plus the
      already-ratified `structural_stop_buffer_pct`, give a floor read off
      the chart instead of off this multiple? Item 191 settles what
      fraction of real candidates that covers and what the stop does when
      no computed level exists below entry at all, which is the only
      population an ATR multiple would still govern. 2.5 is the INTERIM
      value meanwhile and is deliberately not re-picked: with no cited
      band, moving it would be one more unsourced choice.
    cost_while_unanswered: >-
      Two costs, and the second was omitted from this field until
      2026-09-30. FIRST, every unbacked stop and every position size
      derived from it rests on an uncited number; because sizing is
      risk-based the dollar loss if the stop fills does not change with
      it, so what moves is position size and how often noise stops the
      trade out. SECOND, and this is the one that is invisible: this
      number also sets the universe screen's volatility ceiling
      (`STOP_SANITY_FLOOR_FRACTION` divided by the widest reachable
      multiple), so it removes names from consideration ENTIRELY, before
      any seat analyses them. A name screened out is never seen, never
      logged as a refusal, and never appears in any review — so the cost
      of this number is paid mostly where nobody can observe it. That gate
      ships disabled today (`universe_screen.enabled: false`), which
      bounds the live cost to sizing alone; it does not bound the cost if
      the screen is ever switched on.
      ITEM 199 OUTCOME 2026-09-30: the chart cannot replace this number, and
      the population it governs is stated here rather than assumed. Measured
      over 867 production technical-seat candidates carrying entry price,
      ATR14 and computed levels: 97.2% have a computed level at or below entry
      at any touch count, but the NEAREST such level sits closer to entry than
      this flat floor for 71.8% of them (gap distribution in ATRs: p10 0.15,
      p50 1.41, p75 2.65, p90 5.14, max 10.1). A structural level used as a
      WIDENING anchor therefore changes nothing for roughly seven candidates
      in ten, and on the 28.2% where it does bind it runs out to 10.1 ATRs,
      which is a four-fold position-size cut. Capping that widening at this
      multiple makes the rule arithmetically inert; any other cap is a new
      invented money number. So this value governs the WHOLE unbacked-stop
      population, not a residue, and its status stays arbitrary. The only
      thing that can change that is an owner-appetite dial: the maximum stop
      widening, in ATRs, the desk will accept in order to sit behind real
      structure. It is deliberately not picked here.
