  - id: src.config.SmartMoneyConfig.min_external_price_usd
    value: 5
    status: sourced
    site: src/config/__init__.py
    source: >-
      17 CFR 240.3a51-1(d), the SEC's definition of "penny stock": a security
      is a penny stock unless, among the listed exclusions, it has a price of
      $5.00 or more.
      https://www.ecfr.gov/current/title-17/chapter-II/part-240/section-240.3a51-1
      $5.00 is the boundary of the penny-stock regime and of the Rule
      15g-2..15g-9 disclosure, suitability and confirmation requirements that
      attach to transactions in one. It is fixed by the Commission, not by
      this desk.
    note: >-
      2026-10-02, item 90 follow-up pass. The admission screen for an EXTERNAL
      nomination -- a name the desk does not already follow -- rejects a quote
      below $5. Re-read as an UNDENIABLE regulatory boundary rather than a
      round price: $5.00 is the one externally fixed price line in US equities,
      and the screen's effect is to keep the penny-stock regime out of the
      nominating universe entirely. The value is not a point chosen on a
      distribution, so nothing here is fitted and nothing is ratified into
      place. WHAT THIS DOES NOT SETTLE, said explicitly because the row's
      previous open question was a different question: it does NOT establish
      the price below which spread and tick granularity make this desk's STOP
      PLACEMENT unreliable. That is a property of the instrument's quote, not
      of the Commission's threshold; it governs stop geometry, not external
      admission, and it stays open on the stop rows
      (`src.config.RiskConfig.absolute_min_stop_atr_multiple` and
      `src.portfolio_constructor.config.ConstructorConfig.structural_stop_buffer_pct`),
      where the stop distance it would bound is actually computed. The desk may
      still want a HIGHER external floor than $5 for that reason; this entry
      sources the floor that is here, and says plainly that a tick-and-spread
      measurement could raise it. No value changed.
