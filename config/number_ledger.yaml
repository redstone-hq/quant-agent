  - id: src.infra_retry_policy.MAX_RETRIES
    value: 2
    status: sourced
    site: src/infra_retry_policy.py
    source: 'Owner ruling 2026-10-08 quoted at src/price_feed_preflight.py::wait_for_today_prints (keep re-asking until a price is received, never hammer the provider); Alpaca free-plan market-data limit of 200 requests/minute, https://docs.alpaca.markets/docs/about-market-data-api'
    note: "Retries of a failed read before the harder failure path runs: the live-price read behind every sizing read, the entry-stage price-feed preflight and the today-print re-ask (src/execution/price_read.py), as well as LLM-provider blips and owner-alert sends. Trade-governing since 2026-10-08: it decides when a name with no readable price is skipped and when a failed read is classified, so it changes WHETHER an entry is placed, never its price or size. Basis, stated exactly: the owner ruled the pacing (keep re-asking gently within the free 200 requests/minute limit); the VALUE is the desk-wide transient-fault default it already was (the same number as `MacroConfig.max_retries` in src/config/macro.py) and is not derived from the limit, which only bounds it. Computed share of the limit, not measured: at the 8 s ceiling the today-print re-ask issues 60/8 = 7.5 asks a minute, 3.75% of 200; each ask can retry inside itself up to MAX_RETRIES times, so the worst case is 22.5 requests a minute, 11.25%. The limit is ledgered at src.execution.broker_parts.trade_stream_reconnect._STREAM_ATTEMPT_CEILING_PER_DAY."
