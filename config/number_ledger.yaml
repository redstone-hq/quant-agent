  - id: src.delever.forced.DeleverForced._force_delever:factor[0]
    value: 0.97
    status: derived
    site: src/delever/forced.py
    derived_from: src.execution.broker.AlpacaBroker.STOP_LIMIT_BUFFER_PCT
    base_value: 0.03
    note: >-
      The CONSERVATIVE proceeds estimate for the sweep's break-early guard:
      projected_proceeds += mark x 0.97. The de-lever no longer prices its SELL
      off a fixed % of a stale mark -- it crosses the LIVE quote or sends a
      MARKET order (see _live_delever_price, delever-live-fill, supersedes the
      former fixed-3%-limit sites) -- so this is now solely an accounting
      haircut: it assumes the marketable fill lands up to 3% below the mark
      (the same must-fill slippage STOP_LIMIT_BUFFER_PCT budgets for a gapping
      exit) so the loop never stops one position too early and leaves a
      residual deficit. Under-counting proceeds is the safe error. 0.97 =
      1 - STOP_LIMIT_BUFFER_PCT, not a fresh number. Was factor[1] until
      2026-09-30 (board item 182): the 1.02 sweep-sizing cushion that used to
      precede it in this function was reformulated away, so this literal is
      now the first factor-band literal in source order. Positional id only --
      the number and its derivation are unchanged. Its APPLICATION was
      narrowed in the same commit: it now covers WHOLE-position sells only.
      A partial sweep slice is credited at the live SELL limit it was sized
      off, because crediting the whole park's market_value for a slice
      overstated proceeds by everything left parked -- the figure this
      loop's break-early guard and its owner-facing incompleteness alert
      both read. Under a full fill that overstatement changed no decision,
      since the slice is sized to cover the deficit by construction; it
      corrupted the REPORTED figure, and it stops being harmless the moment
      proceeds are booked from an actual filled quantity.
      SCOPE LIMIT, unfixed and pre-existing: proceeds are still booked at
      broker ACCEPTANCE, not at fill. _submit_protected_sell returns an
      accepted order and nothing reads filled_qty, so a PARTIAL FILL still
      leaves a residual deficit this loop cannot see. Alpaca documents
      partially_filled as an order status and the limit rests at the live
      bid, whose displayed size is finite, so this is a reachable state, not
      a theoretical one. Booking from the filled quantity and continuing to
      sell while the deficit stands would delete this haircut entirely.
