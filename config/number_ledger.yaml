  - id: src.portfolio_constructor.config.ConstructorConfig.structural_stop_buffer_pct
    value: 0.005
    status: arbitrary
    site: src/portfolio_constructor/config.py
    note: >-
      NARROWED 2026-10-04 (branch reachability only; the value is NOT
      settled): the only consumer is the no-ATR branch, entered when the
      analysis carries no ATR(14). Running the live indicator function over
      every 40-bar window of the committed daily-bar fixture (1197 windows,
      7 symbols) produced an ATR in all of them [measured]; it is absent only
      under 15 bars of history, so this branch is NEVER EXERCISED on that
      data -- not proven safe, not proven broken. Pinned by
      tests/test_no_atr_branch_reachability.py. No other consumer reads it.
      How far BELOW a structural level (ABOVE it for a short) the protective
      stop is placed when it must be READ from price structure because there is
      no ATR reading -- `_derive_structural_stop_no_atr`, added for board item
      80 (owner ruling 2026-09-25: a missing volatility reading is never a
      reason to skip protection or to size off an unverifiable typed number, so
      the stop is derived from the nearest verified computed level, else the
      signal/prior bar, and the position is HELD). A fraction of the level
      price, so a wick that just tags the level does not trigger. The published
      methods this implements -- swing-low (IG, LuxAlgo), prior-bar low (Ticker
      Daily), Donchian channel-low -- all agree a buffer is needed but none
      fixes its size, so this is OWNER-APPETITE, not doctrine. 0.5% is a modest
      default, deliberately smaller than the 1.0% level-cluster zone
      (levels.CLUSTER_TOLERANCE_PCT) so the stop sits just past the zone the
      level was matched within, never inside it.
    open_question: >-
      What buffer past a structural level does the owner want a no-ATR
      protective stop to sit at -- a fixed percentage like this, the level's
      own cluster half-width, or a value tied to the instrument's recent range?
    cost_while_unanswered: >-
      A no-ATR name's protective stop sits a flat 0.5% past its level rather
      than a distance anyone chose; too tight risks a wick-out, too loose gives
      up more than intended on the rare name that loses its ATR reading.
    settles_by:
      kind: recording
      state: specified
      where: >-
        src/portfolio_constructor/no_atr_stop_record.py emits one row per branch
        entry on the portfolio-constructor package logger, prefixed NO_ATR_STOP_ROW
        and read back by its own rows_from/summarise. The state stays `specified`
        and NOT `built` on purpose -- `built` in this ledger means the evidence
        lands in a named storage field, and this recording's evidence lands in a
        log row, so claiming `built` would mean naming a field nothing writes.
        docs/board_notes/item-090.md (item 90)
      records: >-
        every entry into the no-ATR structural stop branch, ONE ROW PER DECISION and
        no running total of any kind -- every count is computed from the rows at read
        time. Each row carries the rule it took (nearest verified computed level, else
        the signal/prior bar, else nothing usable), the level and its touch count, the
        distance this flat 0.5% put the stop at, the stop's distance from entry, and
        the half-width of the MEASURED cluster span that formed the level TOGETHER
        WITH a flag saying whether that half-width was readable at all rather than
        absent. A branch entry that finds no usable structure writes its own row, so
        "never reached" (no row), "ran and placed" and "ran and found nothing" stay
        three distinguishable facts. Nothing here consults the trade's profit or loss
        and nothing here moves a stop
      closes_when: >-
        enough rows exist to show how often this branch runs at all and how often a
        measured cluster half-width is present at placement. BUILDING THE RECORDING
        SETTLES NOTHING: this row stays `arbitrary` until real entries accumulate --
        the instrumentation exists, the evidence does not. If the half-width is
        routinely present the buffer becomes that measured half-width per name and the
        flat percentage is DELETED; if it is routinely unavailable the flat percentage
        stays and the recording states how often the branch ran, so the cost is at
        least a measured number instead of an assumption; if the branch effectively
        never runs the number stops mattering and the ledger says so instead of guessing
