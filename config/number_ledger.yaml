  - id: src.execution.broker.AlpacaBroker.STOP_LIMIT_BUFFER_PCT
    value: 0.03
    status: arbitrary
    site: src/execution/broker.py
    note: >-
      Board item 138. How far past the trigger a protective stop-limit's limit
      sits (3%). As of the 2026-09-25 owner ruling, PRIMARY protective stops
      are stop-MARKET (guaranteed exit), so this NO LONGER governs the stop
      the desk normally places. It now governs only (a) the stop-limit
      FALLBACK taken when the broker refuses a stop-market for an unsupported
      order-type/tif combo (src/execution/broker.py `_submit_stop_limit_order`)
      and (b) the force-de-lever must-fill SELL / its proceeds haircut
      (the derived 0.97 below). Still re-used, on the fallback path, by stop
      repair (src/execution/stop_repair.py) and the scale-in rearm. A class
      attribute, so rules (a)/(b) never saw it; PR #544's description said it
      was ledgered and it was not. src/execution/scale_in.py (outside scope)
      re-uses this same buffer via
      `getattr(broker, "STOP_LIMIT_BUFFER_PCT", AlpacaBroker.STOP_LIMIT_BUFFER_PCT)`;
      it holds no independent 0.03 literal, so this class attribute is the
      single source of the value [verified 2026-09-25]. A per-placement
      recorder now exists (see settles_by.records); it makes the leg count
      observable and changes no behaviour, and the value itself is STILL
      ARBITRARY -- a counter is not a measurement.
    open_question: >-
      On this desk's names, how far past a stop trigger does a stop-LIMIT
      fill actually land on the gap/fast-market days the stop exists for --
      measured from the broker's own stop fills -- and what limit distance
      keeps the fill probability acceptable on the fallback / de-lever legs?
      (The primary protective stop no longer depends on this: a stop-market
      fills when elected.)
    cost_while_unanswered: >-
      On the fallback / de-lever legs only: too tight and a gapping stop-limit
      does not fill, so the position stays open unprotected until a session
      acts; too wide and every such exit can give back up to 3% beyond the
      stop. The primary stop-market path is not exposed to this trade-off.
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/, item 90, the 2026-10-01 sixth routing tranche (execution plumbing and the level scan)
      records: >-
        over the universe the desk could trade, the distance between a prior-
        session close and the next session's opening print on gap days, and the
        intraday range travelled on the fastest sessions, read off daily bars,
        so the limit distance a stop-LIMIT needs in order to stay marketable on
        exactly the days it exists for is read off the instrument rather than
        fitted to this desk's own fills; alongside it, a count of how often the
        fallback and de-lever legs are actually taken now that primary
        protective stops are stop-MARKET. THAT COUNT NOW HAS A SOURCE: every
        protective-stop placement writes one durable row to the
        `reconciliation_runs` table under kind `stop_limit_buffer:primary` or
        `stop_limit_buffer:fallback` (src/execution/stop_limit_buffer_records.py,
        written from src/execution/broker_parts/stop_place.py). Each row carries
        the trigger, the limit, the absolute trigger-to-limit distance, the
        buffer in force and whether the limit came from this constant or from
        an explicit caller limit, so a reader can join a placement to its fill
        rather than only counting that the leg fired. NO TOTAL IS STORED: the
        count is a count over the rows at read time, and the ABSENCE of rows
        means never exercised, never zero. Building the recorder settles
        nothing on its own -- THIS NUMBER REMAINS ARBITRARY until real
        placements accumulate and the gap measurement above is taken.
      closes_when: >-
        the measured gap distribution identifies a distance at which an
        acceptable share of stop-limit exits would still have been marketable,
        and the fallback buffer becomes that reading. DELETE outcome: if the
        recorded `stop_limit_buffer:fallback` rows show the stop-limit fallback
        is never taken because
        the primary stop-market path absorbs every protective exit, the constant
        and the leg it serves go together rather than the percentage being re-
        picked.
