    value: 1
    status: sourced
    site: src/risk/rules.py
    source: >-
      src/risk/rules.py::distance_to_forced_liquidation_pct, and enforced by tests/test_signed_dissent.py.
      The owner's standing rule of 2026-08-31 (src/conviction_ledger.py) is
