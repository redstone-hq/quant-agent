  - id: src.data.event_calendar.fomc._FOMC_MAX_MEETING_DAYS
    value: 4
    status: sourced
    site: src/data/event_calendar/fomc.py
    source: 'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (meeting blocks are 1-2 days)'
    note: >-
      Sanity bound on one parsed FOMC meeting block, used to DROP a parse
      result rather than show a seat a fabricated multi-week "meeting". The
      Fed's published calendar schedules regular meetings as one-day or
      two-day blocks and unscheduled meetings as a single day, so the longest
      legitimate block is two days; 4 is that observed maximum with one
      doubling of headroom so a legitimate block is never discarded and only
      an obviously broken parse is. It only ever rejects data; it sets no
      window a trade is measured against.
  - id: src.data.event_calendar.fomc._FOMC_CACHE_BACKFILL_DAYS
    value: 45
    status: sourced
    site: src/data/event_calendar/fomc.py
    source: 'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (eight meetings a year)'
    note: >-
      How far BACK the on-disk FOMC cache keeps concluded meetings. The
      cache is a forward calendar; the only backward requirement is that a
      meeting which has already concluded still reads as "just happened"
      until the next one is scheduled. The FOMC holds eight regular meetings
      a year, i.e. one roughly every 365/8 = 45.6 days, so one full
      inter-meeting interval is the smallest margin that never leaves the
      cache with no recent meeting in it. No order, size, price or stop is
      computed from it.
  - id: src.data.event_calendar.macro.RELEASE_SCHEDULE_LOOKAHEAD_DAYS
    value: 120
    status: sourced
    site: src/data/event_calendar/macro.py
    source: 'src/data/event_calendar/macro.py::RELEASE_SCHEDULE_LOOKAHEAD_DAYS (the derivation comment above the constant)'
    note: >-
      FETCH window for one `/fred/release/dates` request, explicitly NOT the
      horizon a seat judges imminence against (`get_upcoming_events`'s
      `horizon_days` does that). The derivation is written out at the
      definition site: every release in `MACRO_RELEASES` except weekly
      Initial Jobless Claims publishes monthly, so four monthly cycles is the
      smallest round multiple that still returns about three future dates per
      release when the nearest has just passed, which is what makes an EMPTY
      response trustworthy evidence of a genuinely unpublished schedule
      rather than a too-narrow window. Widening it costs nothing: it is the
      same single request with a later `realtime_end`.
