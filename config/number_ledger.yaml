  - id: src.agents.base.AgentResult._EXPECTED_AGENT_KEY_WEIGHTS['actions']
    value: 50
    status: arbitrary
    site: src/agents/base.py
    note: >-
      Weight of one top-level key when choosing which JSON fragment of a
      seat's reply is its real output (src/agents/base.py::AgentResult._shape_score). Parse
      plumbing that has decided trades: src/agents/base.py::AgentResult._EXPECTED_AGENT_KEY_WEIGHTS records
      that a stale table made 10 of 13 decision runs on 2026-08-17/20 end in
      'no trades'. The ORDERING (real anchors outrank nested fragments) has a
      stated reason; the point values do not.

      SORT-KEY CHECK, 2026-10-01: this table is NOT the sort-key shape the
      smart-money tranche found. `_shape_score` SUMS the weight of every
      expected key present in a candidate and compares those sums across
      candidates, and a top-level list scores the SUM of its elements, so the
      spacing is load-bearing and does not cancel -- the 2026-08-17/20
      collapse was exactly a spacing collision, a PortfolioDecision scoring 40
      losing to its own eight-element `targets` array at 5 apiece. Only a
      measurement of real contests can settle the spacing; an order-preserving
      relabelling would NOT be safe here.
    open_question: >-
      Replayed over the recorded seat replies (tests/fixtures/pm_response_*
      and the stored raw outputs), does any reply's chosen fragment change if
      these weights are replaced by a rule that needs no numbers, e.g. 'the
      fragment containing the expected schema's required keys'?
    cost_while_unanswered: >-
      A seat reply containing a stray fragment can be parsed as the wrong
      object, which has already emptied a morning's trades once; a new seat
      key missing from this table repeats it.
    settles_by:
      kind: measurement
      state: specified
      where: >-
        docs/board_notes/ `## item 90` -- the 2026-10-01 tranche-three
        routing pass, which specifies each recording field by name
      records: >-
        every seat reply that produced more than one JSON candidate: the key
        set of each competing candidate, the shape score each one scored,
        which candidate was taken and by which parse route, so every contest
        this table has decided is readable instead of assumed.
      closes_when: >-
        the recorded contests show which key sets actually compete in
        production, so each weight is set from the key sets that must
        out-score each other -- including the container-sum collision that
        ended 10 of 13 decision runs on 2026-08-17/20 -- rather than chosen; a
        key that never appears in any contest is deleted rather than
        re-derived.
