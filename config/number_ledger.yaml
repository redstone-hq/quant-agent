      alpaca-py default (site-packages/alpaca/trading/stream.py:54,
      alpaca-py 0.43.5). Same reasoning as
      src.execution.broker._ALPACA_STREAM_RECONNECT_MIN_S: bounds an
      optional notification socket's retry speed, not a trade decision.
  - id: src.execution.broker_parts.trade_stream_reconnect._STREAM_ATTEMPT_CEILING_PER_SESSION
