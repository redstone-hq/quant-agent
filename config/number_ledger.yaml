    note: 'DERIVED 2026-10-02 (fix #4, first slice), and the derivation is that NO CHOICE WAS MADE:
      2.0x is not an appetite this desk set, it is the maximum gross an overnight margin account is
      permitted to initiate. Federal Reserve Regulation T (12 CFR 220.12(a)) requires 50% initial
      margin on a margin equity security, so the largest position a margin account may OPEN is twice
      its own equity; Alpaca restates the same limit as 2x overnight buying power against 4x intraday
      for a pattern-day-trade account, which is the `Alpaca''s own 4x` the sizing module''s comment
      at src/pipeline_sizing.py@`# ladder-resolved gross headroom, so the de-leve` refers to and which applies only within a session. The desk is
      flat-to-long overnight by construction, so the binding external bound is the 2x initial one
      and the configured cap sits EXACTLY on it. WHAT THE OWNER SHOULD READ IN THIS: the standing
      gross ceiling is `as much as the law allows`. That is the ABSENCE of a leverage decision, not
      a leverage decision, and the only thing standing between the book and the regulatory maximum
      is the de-levering ladder below (GROSS_LADDER), whose own rungs are owner appetite. The field
      validator at src/config/__init__.py::RiskConfig permits up to 4.0, a value Regulation T would not let
      the desk hold overnight at all. The old `measurement` route is retired with this change: a measurement
      of this account''s gap behaviour can only argue for a cap BELOW the regulatory maximum, which
      is an appetite question about the ladder, not a source for this number. PRIOR NOTE, kept verbatim:
      Gross-exposure ceiling, owner-ratified 2026-09-01 per the definition site. Ratified, not sourced:
      nothing reads 2.0x off the account or off a cited requirement, and the de-levering ladder that
      can only tighten it is itself unsourced (GROSS_LADDER below).'
