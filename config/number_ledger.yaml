  - id: src.execution.broker_parts.trade_stream_bounds._ALPACA_STREAM_RECONNECT_MIN_S
    value: 1.0
    status: not-trade-governing
    site: src/execution/broker_parts/trade_stream_bounds.py
    note: >-
      Fallback reconnect floor for the trade_updates fill-notification
      socket, used only when the installed alpaca-py TradingStream does not
      expose its own backoff attributes. It copies alpaca-py's own default
      (site-packages/alpaca/trading/stream.py:53, alpaca-py 0.43.5) rather
      than inventing a second clock. It decides how fast an optional
      notification socket retries, never whether or how much to trade; the
      bounded REST fill-confirmation path is unaffected when this socket is
      off entirely.
  - id: src.execution.broker_parts.trade_stream_bounds._ALPACA_STREAM_RECONNECT_MAX_S
    value: 30.0
    status: not-trade-governing
    site: src/execution/broker_parts/trade_stream_bounds.py
    note: >-
